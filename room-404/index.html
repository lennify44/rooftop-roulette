<style>
:root {
  /* Layout: a hotel-noir point-and-click; clock bar on top, the scene in the middle, narration and inventory below; close-ups open as a panel */
  --night: #120e18;
  --wall: #2c2235;
  --brass: #d9a74a;
  --chalk: #f3ece0;
  --haze: #a99cb5;
  --good: #6fdca8;
  --bad: #ff6b5b;
  --panel: #1c1624;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Barlow", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; overflow: hidden; background: var(--night); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--chalk); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#app {
  position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 8px;
  padding-block: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-bottom)); padding-inline: max(10px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-right));
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.clock { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-mono); }
.clock b { font-size: 26px; font-weight: 600; color: #ff5a4e; text-shadow: 0 0 10px rgba(255, 90, 78, 0.6); font-variant-numeric: tabular-nums; }
.clock small { font-size: 12px; color: var(--haze); }
.clock.low b { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.35; } }
.loc { flex: 1; min-width: 0; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--brass); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock small { white-space: nowrap; }
.tools { display: flex; gap: 8px; }
.tool { min-width: 40px; height: 40px; padding: 0 12px; display: grid; place-items: center; border: 1.5px solid rgba(243, 236, 224, 0.3); border-radius: 20px; background: transparent; color: var(--chalk); cursor: pointer; font-family: var(--font-body); font-weight: 600; font-size: 14px; }
.tool svg { width: 18px; height: 18px; }
.stage { position: relative; min-height: 0; display: grid; place-items: center; }
.scene { position: relative; width: 100%; max-height: 100%; aspect-ratio: 5 / 3; max-width: calc((100vh - 220px) * 5 / 3); }
.scene svg { display: block; width: 100%; height: 100%; border-radius: 8px; }
[data-hot] { cursor: pointer; }
.nav { position: absolute; bottom: 6px; width: 48px; height: 44px; border: 0; border-radius: 8px; background: rgba(18, 14, 24, 0.7); color: var(--chalk); cursor: pointer; font-size: 22px; }
.nav.l { left: 4px; } .nav.r { right: 4px; }
.say { margin: 0; min-height: 3em; padding: 8px 12px; background: var(--panel); border-left: 3px solid var(--brass); font-size: 15px; }
.inv { display: flex; gap: 8px; min-height: 64px; overflow-x: auto; padding-bottom: 2px; }
.inv .empty { align-self: center; color: var(--haze); font-size: 13px; }
.item { flex: 0 0 auto; width: 64px; height: 64px; display: grid; place-items: center; align-content: center; gap: 0; padding: 4px; border: 2px solid rgba(243, 236, 224, 0.2); border-radius: 10px; background: var(--panel); color: var(--chalk); cursor: pointer; font-family: var(--font-body); }
.item span { font-size: 26px; line-height: 1.1; }
.item small { font-size: 10px; line-height: 1.1; color: var(--haze); text-align: center; }
.item[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 2px var(--brass); }
.item.new { animation: pop 0.5s; }
@keyframes pop { 0% { transform: scale(0.4); } 70% { transform: scale(1.15); } }
.tool:focus-visible, .item:focus-visible, .nav:focus-visible, .btn:focus-visible, .link-btn:focus-visible, .key:focus-visible, .chip:focus-visible, .lb-tabs button:focus-visible, .lb-row input:focus-visible, [data-hot]:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.modal { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: rgba(10, 8, 14, 0.82); }
.panel { width: min(100%, 560px); max-height: 100%; overflow-y: auto; display: grid; gap: 12px; padding: 16px; background: var(--panel); border: 1.5px solid rgba(217, 167, 74, 0.5); border-radius: 12px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.1; color: var(--brass); }
.panel p { margin: 0; }
.panel .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.panel svg { width: 100%; height: auto; border-radius: 8px; }
.btn { border: 0; cursor: pointer; padding: 0.5em 1.4em; border-radius: 999px; color: var(--night); background: var(--brass); font-family: var(--font-body); font-weight: 600; font-size: 17px; }
.btn.ghost { background: transparent; color: var(--chalk); border: 1.5px solid rgba(243, 236, 224, 0.4); }
.link-btn { border: 0; background: none; padding: 6px 0; cursor: pointer; color: var(--chalk); font-family: var(--font-body); font-weight: 600; font-size: 16px; text-decoration: underline; text-underline-offset: 4px; }
.keypad { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; justify-content: center; }
.key { height: 52px; border: 1.5px solid rgba(243, 236, 224, 0.3); border-radius: 10px; background: #2a2233; color: var(--chalk); cursor: pointer; font-family: var(--font-mono); font-weight: 600; font-size: 20px; }
.key.glow { color: #c8a2ff; border-color: #a77cff; box-shadow: 0 0 14px #8f5cff, inset 0 0 10px rgba(143, 92, 255, 0.5); }
.key.wide { grid-column: span 1; font-size: 14px; }
.display { min-width: 180px; padding: 8px 14px; border-radius: 8px; background: #0b0910; color: #ff5a4e; text-align: center; font-family: var(--font-mono); font-weight: 600; font-size: 28px; letter-spacing: 0.2em; text-shadow: 0 0 8px rgba(255, 90, 78, 0.6); font-variant-numeric: tabular-nums; }
.display.ok { color: var(--good); text-shadow: 0 0 8px rgba(111, 220, 168, 0.6); }
.tvscreen { min-height: 150px; display: grid; place-items: center; padding: 16px; border-radius: 14px; border: 10px solid #1a1a1a; background: #0d1a14; color: #c9f7dd; text-align: center; font-family: var(--font-mono); font-size: 15px; }
.tvscreen.static { background: repeating-linear-gradient(0deg, #222 0 2px, #444 2px 4px); color: #ddd; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { padding: 10px 14px; border: 1.5px solid rgba(243, 236, 224, 0.35); border-radius: 10px; background: #2a2233; color: var(--chalk); cursor: pointer; font-family: var(--font-body); font-weight: 600; font-size: 15px; }
.chip.take { border-color: var(--brass); }
.note { padding: 12px 14px; border-radius: 6px; background: #efe6d2; color: #2a2030; font-family: var(--font-display); font-size: 16px; }
.hints { display: grid; gap: 8px; }
.hints li { margin-left: 18px; }
/* screens */
.screen { position: absolute; inset: 0; z-index: 5; display: grid; align-items: center; overflow-y: auto; padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); background: radial-gradient(ellipse at 70% 30%, #3a2a2a 0%, #120e18 65%); }
.menu { width: 100%; max-width: 980px; margin-inline: auto; display: grid; align-items: center; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px 44px; }
.menu > * { min-width: 0; }
.eyebrow, .label { margin: 0; font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--haze); }
.logo { margin: 4px 0 10px; font-family: var(--font-display); font-weight: 800; font-size: clamp(54px, 11vw, 110px); line-height: 0.9; }
.logo span { color: var(--brass); }
.lede { margin: 0 0 16px; max-width: 46ch; opacity: 0.92; }
.cta-row, .sub-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.sub-row { margin-top: 12px; }
.side { display: grid; gap: 8px; align-content: start; }
.stats { margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 10px 28px; }
.stats dt { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--haze); }
.stats dd { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.lb-tabs { display: flex; gap: 6px; }
.lb-tabs button { padding: 3px 10px; border: 1.5px solid rgba(243, 236, 224, 0.35); background: transparent; color: var(--chalk); cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.lb-tabs button[aria-pressed="true"] { background: var(--chalk); color: var(--night); border-color: var(--chalk); }
.toplist { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 3px; font-variant-numeric: tabular-nums; }
.toplist li { display: grid; grid-template-columns: 22px 1.3fr 1fr 0.9fr; gap: 8px; align-items: baseline; font-size: 14px; }
.toplist b { font-family: var(--font-display); font-size: 17px; color: var(--brass); }
.toplist li span:last-child { font-family: var(--font-mono); font-size: 11px; color: var(--haze); }
.toplist li.me span:nth-child(2) { color: var(--brass); font-weight: 600; }
.toplist .none { display: block; color: var(--haze); }
.toplist a { color: var(--chalk); }
.lb-post { display: grid; gap: 4px; margin: 10px 0 0; font-size: 13px; color: var(--haze); }
.lb-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.lb-row input { width: 12em; max-width: 100%; padding: 6px 8px; border: 1.5px solid rgba(243, 236, 224, 0.4); background: rgba(18, 14, 24, 0.6); color: var(--chalk); font: 600 16px var(--font-body); }
.tip { margin: 6px 0 0; font-size: 14px; opacity: 0.9; }
@media (max-height: 520px) {
  #app { grid-template-columns: minmax(0, 1fr) minmax(200px, 34%); grid-template-rows: auto minmax(0, 1fr) auto; column-gap: 10px; }
  .bar { grid-column: 1 / -1; }
  .stage { grid-row: 2 / 4; }
  .say { grid-column: 2; grid-row: 2; align-self: start; max-height: 100%; overflow-y: auto; font-size: 14px; }
  .inv { grid-column: 2; grid-row: 3; flex-wrap: wrap; overflow-y: auto; max-height: 150px; }
  .item { width: 56px; height: 56px; } .item span { font-size: 22px; }
  .scene { max-width: calc((100vh - 70px) * 5 / 3); }
  .logo { font-size: clamp(46px, 8vw, 70px); } .lede { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { .clock.low b, .item.new { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <header class="bar">

  <footer class="inv" id="inv" data-i18n-aria="inventory" aria-label="Inventory"></footer>

  <div class="modal" id="modal" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle"></h2><div id="mBody" style="display:grid;gap:12px"></div><div class="row"><button class="btn ghost" id="mClose" type="button" data-i18n="close">Close</button></div></div></div>

      </div>

        <div class="lb-tabs" id="lbTabs"><button type="button" data-lb="alltime" aria-pressed="true" data-i18n="allTime">All time</button><button type="button" data-lb="daily" aria-pressed="false" data-i18n="today">Today</button></div>
        <ol class="toplist" id="lbList"><li class="none">…</li></ol>
      </div>
    </div>
  </section>

  <section class="screen" id="screenEnd" aria-label="The end" hidden>
    <div class="menu">
      <div>
        <p class="eyebrow" id="endEyebrow"></p>
        <h1 class="logo" id="endTitle" style="font-size: clamp(44px, 9vw, 90px)"></h1>
        <p class="lede" id="endText"></p>

        <div class="lb-post" id="lbPost" hidden>

        </div>
        <p class="tip" id="lbResult"></p>
      </div>
    </div>
  </section>
</div>

const Sound = {
  ctx: null, master: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { const AC = window.AudioContext || window.webkitAudioContext; this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = profile.muted ? 0 : 0.5; this.master.connect(this.ctx.destination); } catch (e) { this.ctx = null; }
  },
  setMuted(m) { if (this.master) this.master.gain.value = m ? 0 : 0.5; },
  tone(f, dur, type = 'sine', vol = 0.1, slide = 0, delay = 0) {
    if (!this.ctx) return; const t0 = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur); o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.02);
  },

    s.connect(f); f.connect(g); g.connect(this.master); s.start(t0);
  },
  click() { this.tone(900, 0.04, 'square', 0.04); },
  pickup() { this.tone(660, 0.1, 'triangle', 0.1); this.tone(990, 0.16, 'triangle', 0.08, 0, 0.08); },
  nope() { this.tone(200, 0.18, 'square', 0.05, -40); },

};

  if (id === 'handle' && h === 'door') { take('handle'); f.doorOpen = true; Sound.door(); say(t('doorOpened')); return true; }
  if (id === 'uv' && h === 'painting') { S.sel = null; say(t('uvPainting')); return true; }

  return false;
}

// ---------- clock and endings
let lastTick = 0, paused = true;
function tickClock() {
  $('clock').textContent = S.overtime ? t('overtime') : hotel();
  $('left').textContent = S.overtime ? t('overtimeLeft') : t('minLeft', Math.ceil(S.left / 60));
  $('clockBox').classList.toggle('low', !S.overtime && S.left < 300);
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!S || paused || S.done) { lastTick = now; return; }
  const dt = Math.min(1, (now - (lastTick || now)) / 1000); lastTick = now;
  if (!S.overtime) {
    const before = Math.ceil(S.left / 60);
    S.left -= dt;
    if (Math.ceil(S.left / 60) !== before) { tickClock(); if (S.view === 'bed' && $('modal').hidden) renderScene(); save(); }
    if (S.left <= 0) { S.left = 0; timeUp(); }
  }
  // steam builds while the shower runs and slowly fades when it is off
  const target = S.f.showerOn ? 1 : 0, old = S.steam;
  S.steam += (target - S.steam) * dt * (S.f.showerOn ? 0.45 : 0.12);
  if (S.view === 'bath' && $('modal').hidden && Math.abs(S.steam - old) > 0.0005 && Math.floor(S.steam * 40) !== Math.floor(old * 40)) renderScene();
}
function showEnd(eyebrow, title, text, left, overtimeOffer) {
  $('endEyebrow').textContent = eyebrow; $('endTitle').textContent = title; $('endText').textContent = text;
  $('endLeft').textContent = mmss(left); $('endHints').textContent = S.hints; $('endBest').textContent = profile.best ? mmss(profile.best) : '–';
  $('btnOvertime').hidden = !overtimeOffer; $('screenEnd').hidden = false;
}
function timeUp() {
  if (S.done || S.overtime) return;
  paused = true; Sound.lose();
  $('modal').hidden = true; $('lbPost').hidden = true; $('lbResult').textContent = '';
  save();
  showEnd(t('upEyebrow'), t('upTitle'), t('upText'), 0, true);
}
function escape() {
  S.done = true; paused = true; Sound.win();
  const left = S.overtime ? 0 : Math.floor(S.left);
  if (!S.overtime) { profile.best = Math.max(profile.best, left); profile.escapes++; saveProfile(); }
  store.del(SAVE_KEY);
  showEnd(S.overtime ? t('winEyebrowOver') : t('winEyebrow', hotel()), t('winTitle'), S.overtime ? t('winTextOver') : t('winText', mmss(left), S.hints), left, false);
  lbAfter(S.overtime ? 0 : left, S.hints);
}
$('btnOvertime').addEventListener('click', () => { S.overtime = true; save(); $('screenEnd').hidden = true; paused = false; tickClock(); say(t('overtimeSay')); });
$('btnEndNew').addEventListener('click', () => newGame());

// ---------- start, menu, saving, language
function begin() {
  Sound.init();
  $('screenStart').hidden = true; $('screenEnd').hidden = true; paused = false; lastTick = 0;
  renderScene(); renderInv(); tickClock();
}
function newGame() { S = freshState(); save(); begin(); say(t('start')); }
// starting over needs a second tap when there is a saved game (a confirm() dialog can be blocked inside embedded previews)
let armedNew = 0;
$('btnNew').addEventListener('click', () => {
  if (store.get(SAVE_KEY, null) && Date.now() - armedNew > 4000) { armedNew = Date.now(); $('btnNew').textContent = t('confirmNew'); return; }
  armedNew = 0; newGame();
});
$('btnContinue').addEventListener('click', () => { S = store.get(SAVE_KEY, null); if (!S || S.done) { newGame(); return; } begin(); say(t('back')); });
$('btnMenu').addEventListener('click', () => { paused = true; save(); showStart(); });
$('navL').addEventListener('click', () => go(S.view === 'bed' ? 'desk' : 'bed'));
$('navR').addEventListener('click', () => go(S.view === 'bed' ? 'desk' : 'bed'));
$('scene').addEventListener('click', (e) => { const h = e.target.closest('[data-hot]'); if (h) tapHot(h.getAttribute('data-hot')); });
$('scene').addEventListener('keydown', (e) => { if (e.key !== 'Enter' && e.key !== ' ') return; const h = e.target.closest('[data-hot]'); if (h) { e.preventDefault(); tapHot(h.getAttribute('data-hot')); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) { paused = true; save(); } else if (S && $('screenStart').hidden && $('screenEnd').hidden) { paused = false; lastTick = 0; } });
document.addEventListener('gesturestart', (e) => e.preventDefault());
function applyLang() {
  document.documentElement.lang = lang; document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.innerHTML = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
  $('btnLang').textContent = t('otherLang'); $('btnLang').setAttribute('lang', lang === 'de' ? 'en' : 'de');
  renderMute(); renderScene(); renderInv(); tickClock();
}
$('btnLang').addEventListener('click', () => { lang = lang === 'de' ? 'en' : 'de'; profile.lang = lang; saveProfile(); applyLang(); showStart(); });
function showStart() {
  const saved = store.get(SAVE_KEY, null);
  $('btnContinue').hidden = !saved || saved.done;
  $('btnNew').textContent = saved && !saved.done ? t('newGame') : t('checkIn'); armedNew = 0;
  $('screenStart').hidden = false; $('screenEnd').hidden = true;
  renderLeaderboard();
}

// ---------- leaderboard (the shared Cloudflare Worker; score = seconds left at the escape)
const LEADERBOARD_URL = 'https://rooftop-leaderboard.rooftop-b71afd.workers.dev';
const PUBLIC_URL = 'https://lennify44.github.io/rooftop-roulette/room-404/';
const GAME_ID = 'room404';
const LB = { cache: null, at: 0, tab: 'alltime', posting: false };
const lbReachable = () => !!LEADERBOARD_URL && location.hostname === 'lennify44.github.io';
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function deviceId() { if (!profile.deviceId) { profile.deviceId = (Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g, '').slice(0, 20); saveProfile(); } return profile.deviceId; }
async function lbFetch(force) {
  if (!lbReachable()) return null;
  if (!force && LB.cache && Date.now() - LB.at < 30000) return LB.cache;
  try { const r = await fetch(`${LEADERBOARD_URL}/scores?game=${GAME_ID}&date=${todayKey()}`); if (!r.ok) return null; LB.cache = await r.json(); LB.at = Date.now(); return LB.cache; } catch (e) { return null; }
}
function lbNote(list, text, link) {
  list.textContent = ''; const li = mk('li', 'none'); li.textContent = text;
  if (link) { const a = document.createElement('a'); a.href = PUBLIC_URL + (lang === 'de' ? '?lang=de' : ''); a.target = '_blank'; a.rel = 'noopener'; a.textContent = t('lbOpen'); li.appendChild(a); }
  list.appendChild(li);
}
async function renderLeaderboard(force) {
  const list = $('lbList');
  $('lbWho').textContent = profile.name ? t('lbWho', profile.name) : '';
  $('lbTabs').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-lb') === LB.tab)));
  if (!lbReachable()) { lbNote(list, t('lbPublic'), true); return; }
  const data = await lbFetch(force);
  if (!data) { lbNote(list, t('lbFail')); return; }
  const rows = (LB.tab === 'daily' ? data.daily : data.alltime).slice(0, 10);
  if (!rows.length) { lbNote(list, LB.tab === 'daily' ? t('lbEmptyDaily') : t('lbEmpty')); return; }
  list.textContent = '';
  rows.forEach((r, i) => {
    const li = mk('li', r.id === profile.deviceId ? 'me' : '');
    const rank = mk('b'); rank.textContent = String(i + 1); li.appendChild(rank);
    for (const text of [r.name, t('lbLeft', mmss(r.score)), t('lbHints', r.dist)]) { const el = mk('span'); el.textContent = text; li.appendChild(el); }
    list.appendChild(li);
  });
}
$('lbTabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; LB.tab = b.getAttribute('data-lb'); renderLeaderboard(); });
let lbLast = null;
function lbAfter(score, hints) {
  const box = $('lbPost'), out = $('lbResult'); out.textContent = ''; box.hidden = true;
  if (!lbReachable() || score <= 0) return;
  lbLast = { game: GAME_ID, score, dist: hints, daily: true, date: todayKey() };
  $('lbName').value = profile.name; box.hidden = false;
  if (profile.name) lbSend();
}
async function lbSend() {
  const name = $('lbName').value.trim().replace(/[^\p{L}\p{N} _.\-]/gu, '').slice(0, 16), out = $('lbResult');
  if (!name) { out.textContent = t('lbNeedName'); $('lbName').focus(); return; }
  if (!lbLast || LB.posting) return;
  if (name !== profile.name) { profile.name = name; saveProfile(); }
  LB.posting = true; out.textContent = t('lbPosting');
  try {
    const r = await fetch(`${LEADERBOARD_URL}/scores`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: deviceId(), name, ...lbLast }) });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) out.textContent = r.status === 429 ? t('lbTooFast') : t('lbRejected');
    else { const rk = res.rank || {}; out.textContent = t('lbRank', rk.alltime, rk.daily); lbLast = null; LB.at = 0; }
  } catch (e) { out.textContent = t('lbFail'); }
  LB.posting = false;
}
$('lbSend').addEventListener('click', lbSend);
$('lbName').addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); lbSend(); } });

// the game browser link opens in the same tab on the public site (keeps a home-screen app in one window)
document.querySelectorAll('a[data-hub]').forEach((a) => { if (location.hostname === 'lennify44.github.io') a.removeAttribute('target'); });
S = store.get(SAVE_KEY, null) || freshState();
applyLang(); say('');
showStart();
requestAnimationFrame(frame);
})();
</script>
<script src="../feedback.js" defer></script>
