<title>Room 404</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  /* Layout: a hotel-noir point-and-click; clock bar on top, the scene in the middle, narration and inventory below; close-ups open as a panel */
  --night: #120e18;
  --wall: #2c2235;
  --brass: #d9a74a;
  --chalk: #f3ece0;
  --haze: #a99cb5;
  --good: #6fdca8;
  --bad: #ff6b5b;
  --panel: #1c1624;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Barlow", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; overflow: hidden; background: var(--night); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--chalk); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#app {
  position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 8px;
  padding-block: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-bottom)); padding-inline: max(10px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-right));
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.clock { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-mono); }
.clock b { font-size: 26px; font-weight: 600; color: #ff5a4e; text-shadow: 0 0 10px rgba(255, 90, 78, 0.6); font-variant-numeric: tabular-nums; }
.clock small { font-size: 12px; color: var(--haze); }
.clock.low b { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.35; } }
.loc { flex: 1; min-width: 0; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--brass); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock small { white-space: nowrap; }
.tools { display: flex; gap: 8px; }
.tool { min-width: 40px; height: 40px; padding: 0 12px; display: grid; place-items: center; border: 1.5px solid rgba(243, 236, 224, 0.3); border-radius: 20px; background: transparent; color: var(--chalk); cursor: pointer; font-family: var(--font-body); font-weight: 600; font-size: 14px; }
.tool svg { width: 18px; height: 18px; }
.stage { position: relative; min-height: 0; display: grid; place-items: center; }
.scene { position: relative; width: 100%; max-height: 100%; aspect-ratio: 5 / 3; max-width: calc((100vh - 220px) * 5 / 3); }
.scene svg { display: block; width: 100%; height: 100%; border-radius: 8px; }
[data-hot] { cursor: pointer; }
.nav { position: absolute; bottom: 6px; width: 48px; height: 44px; border: 0; border-radius: 8px; background: rgba(18, 14, 24, 0.7); color: var(--chalk); cursor: pointer; font-size: 22px; }
.nav.l { left: 4px; } .nav.r { right: 4px; }
.say { margin: 0; min-height: 3em; padding: 8px 12px; background: var(--panel); border-left: 3px solid var(--brass); font-size: 15px; }
.inv { display: flex; gap: 8px; min-height: 64px; overflow-x: auto; padding-bottom: 2px; }
.inv .empty { align-self: center; color: var(--haze); font-size: 13px; }
.item { flex: 0 0 auto; width: 64px; height: 64px; display: grid; place-items: center; align-content: center; gap: 0; padding: 4px; border: 2px solid rgba(243, 236, 224, 0.2); border-radius: 10px; background: var(--panel); color: var(--chalk); cursor: pointer; font-family: var(--font-body); }
.item span { font-size: 26px; line-height: 1.1; }
.item small { font-size: 10px; line-height: 1.1; color: var(--haze); text-align: center; }
.item[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 2px var(--brass); }
.item.new { animation: pop 0.5s; }
@keyframes pop { 0% { transform: scale(0.4); } 70% { transform: scale(1.15); } }
.tool:focus-visible, .item:focus-visible, .nav:focus-visible, .btn:focus-visible, .link-btn:focus-visible, .key:focus-visible, .chip:focus-visible, .lb-tabs button:focus-visible, .lb-row input:focus-visible, [data-hot]:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
/* close-up panel */
.modal { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: rgba(10, 8, 14, 0.82); }
.panel { width: min(100%, 560px); max-height: 100%; overflow-y: auto; display: grid; gap: 12px; padding: 16px; background: var(--panel); border: 1.5px solid rgba(217, 167, 74, 0.5); border-radius: 12px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.1; color: var(--brass); }
.panel p { margin: 0; }
.panel .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.panel svg { width: 100%; height: auto; border-radius: 8px; }
.btn { border: 0; cursor: pointer; padding: 0.5em 1.4em; border-radius: 999px; color: var(--night); background: var(--brass); font-family: var(--font-body); font-weight: 600; font-size: 17px; }
.btn.ghost { background: transparent; color: var(--chalk); border: 1.5px solid rgba(243, 236, 224, 0.4); }
.link-btn { border: 0; background: none; padding: 6px 0; cursor: pointer; color: var(--chalk); font-family: var(--font-body); font-weight: 600; font-size: 16px; text-decoration: underline; text-underline-offset: 4px; }
.keypad { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; justify-content: center; }
.key { height: 52px; border: 1.5px solid rgba(243, 236, 224, 0.3); border-radius: 10px; background: #2a2233; color: var(--chalk); cursor: pointer; font-family: var(--font-mono); font-weight: 600; font-size: 20px; }
.key.glow { color: #c8a2ff; border-color: #a77cff; box-shadow: 0 0 14px #8f5cff, inset 0 0 10px rgba(143, 92, 255, 0.5); }
.key.wide { grid-column: span 1; font-size: 14px; }
.display { min-width: 180px; padding: 8px 14px; border-radius: 8px; background: #0b0910; color: #ff5a4e; text-align: center; font-family: var(--font-mono); font-weight: 600; font-size: 28px; letter-spacing: 0.2em; text-shadow: 0 0 8px rgba(255, 90, 78, 0.6); font-variant-numeric: tabular-nums; }
.display.ok { color: var(--good); text-shadow: 0 0 8px rgba(111, 220, 168, 0.6); }
.tvscreen { min-height: 150px; display: grid; place-items: center; padding: 16px; border-radius: 14px; border: 10px solid #1a1a1a; background: #0d1a14; color: #c9f7dd; text-align: center; font-family: var(--font-mono); font-size: 15px; }
.tvscreen.static { background: repeating-linear-gradient(0deg, #222 0 2px, #444 2px 4px); color: #ddd; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { padding: 10px 14px; border: 1.5px solid rgba(243, 236, 224, 0.35); border-radius: 10px; background: #2a2233; color: var(--chalk); cursor: pointer; font-family: var(--font-body); font-weight: 600; font-size: 15px; }
.chip.take { border-color: var(--brass); }
.note { padding: 12px 14px; border-radius: 6px; background: #efe6d2; color: #2a2030; font-family: var(--font-display); font-size: 16px; }
.hints { display: grid; gap: 8px; }
.hints li { margin-left: 18px; }
/* screens */
.screen { position: absolute; inset: 0; z-index: 5; display: grid; align-items: center; overflow-y: auto; padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); background: radial-gradient(ellipse at 70% 30%, #3a2a2a 0%, #120e18 65%); }
.menu { width: 100%; max-width: 980px; margin-inline: auto; display: grid; align-items: center; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px 44px; }
.menu > * { min-width: 0; }
.eyebrow, .label { margin: 0; font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--haze); }
.logo { margin: 4px 0 10px; font-family: var(--font-display); font-weight: 800; font-size: clamp(54px, 11vw, 110px); line-height: 0.9; }
.logo span { color: var(--brass); }
.lede { margin: 0 0 16px; max-width: 46ch; opacity: 0.92; }
.cta-row, .sub-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.sub-row { margin-top: 12px; }
.side { display: grid; gap: 8px; align-content: start; }
.stats { margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 10px 28px; }
.stats dt { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--haze); }
.stats dd { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.lb-tabs { display: flex; gap: 6px; }
.lb-tabs button { padding: 3px 10px; border: 1.5px solid rgba(243, 236, 224, 0.35); background: transparent; color: var(--chalk); cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.lb-tabs button[aria-pressed="true"] { background: var(--chalk); color: var(--night); border-color: var(--chalk); }
.toplist { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 3px; font-variant-numeric: tabular-nums; }
.toplist li { display: grid; grid-template-columns: 22px 1.3fr 1fr 0.9fr; gap: 8px; align-items: baseline; font-size: 14px; }
.toplist b { font-family: var(--font-display); font-size: 17px; color: var(--brass); }
.toplist li span:last-child { font-family: var(--font-mono); font-size: 11px; color: var(--haze); }
.toplist li.me span:nth-child(2) { color: var(--brass); font-weight: 600; }
.toplist .none { display: block; color: var(--haze); }
.toplist a { color: var(--chalk); }
.lb-post { display: grid; gap: 4px; margin: 10px 0 0; font-size: 13px; color: var(--haze); }
.lb-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.lb-row input { width: 12em; max-width: 100%; padding: 6px 8px; border: 1.5px solid rgba(243, 236, 224, 0.4); background: rgba(18, 14, 24, 0.6); color: var(--chalk); font: 600 16px var(--font-body); }
.tip { margin: 6px 0 0; font-size: 14px; opacity: 0.9; }
@media (max-height: 520px) {
  #app { grid-template-columns: minmax(0, 1fr) minmax(200px, 34%); grid-template-rows: auto minmax(0, 1fr) auto; column-gap: 10px; }
  .bar { grid-column: 1 / -1; }
  .stage { grid-row: 2 / 4; }
  .say { grid-column: 2; grid-row: 2; align-self: start; max-height: 100%; overflow-y: auto; font-size: 14px; }
  .inv { grid-column: 2; grid-row: 3; flex-wrap: wrap; overflow-y: auto; max-height: 150px; }
  .item { width: 56px; height: 56px; } .item span { font-size: 22px; }
  .scene { max-width: calc((100vh - 70px) * 5 / 3); }
  .logo { font-size: clamp(46px, 8vw, 70px); } .lede { font-size: 14px; }
  .lo { grid-template-columns: repeat(3, 56px); } .lo button { width: 56px; height: 56px; }
}
.lo { display: grid; grid-template-columns: repeat(3, 72px); gap: 8px; justify-content: center; }
.lo button { width: 72px; height: 72px; border-radius: 12px; border: 2px solid #3a3040; background: #1a1520; cursor: pointer; }
.lo button.on { background: #ffd54a; border-color: #fff2b0; box-shadow: 0 0 18px #ffb300; }
.lf { display: grid; gap: 8px; }
.lfrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lfrow b { font-family: var(--font-display); font-size: 20px; color: var(--brass); }
.lfrow .chip { min-width: 160px; min-height: 48px; }
.clues { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.vend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.vend .chip { display: grid; gap: 2px; place-items: center; min-height: 72px; }
.vend small { font-size: 12px; color: var(--haze); }
.letters { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.wordin { width: 9em; text-align: center; letter-spacing: 0.3em; font: 600 24px var(--font-mono); text-transform: uppercase; padding: 8px; border-radius: 8px; border: 1.5px solid rgba(243, 236, 224, 0.4); background: #0b0910; color: var(--chalk); }
@media (prefers-reduced-motion: reduce) { .clock.low b, .item.new { animation: none; } }
</style>

<body>
<!-- source:body -->
<div id="app">
  <header class="bar">
    <div class="clock" id="clockBox"><b id="clock">11:15</b><small id="left"></small></div>
    <div class="loc" id="loc">Room 404</div>
    <div class="tools">
      <button class="tool" id="btnHint" type="button" data-i18n="hintBtn">Hint</button>
      <button class="tool" id="btnMute" type="button" aria-label="Sound on" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="muteWave" d="M17 9a4 4 0 0 1 0 6"/><path id="muteX" d="M17 9l5 6M22 9l-5 6" hidden/></svg></button>
      <button class="tool" id="btnMenu" type="button" data-i18n-aria="menu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>
  <main class="stage">
    <div class="scene" id="scene"><div id="sceneSvg" style="height:100%"></div>
      <button class="nav l" id="navL" type="button" data-i18n-aria="turnL" aria-label="Turn left">‹</button>
      <button class="nav r" id="navR" type="button" data-i18n-aria="turnR" aria-label="Turn right">›</button>
    </div>
  </main>
  <p class="say" id="say" aria-live="polite"></p>
  <footer class="inv" id="inv" data-i18n-aria="inventory" aria-label="Inventory"></footer>

  <div class="modal" id="modal" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle"></h2><div id="mBody" style="display:grid;gap:12px"></div><div class="row"><button class="btn ghost" id="mClose" type="button" data-i18n="close">Close</button></div></div></div>

  <section class="screen" id="screenStart" aria-label="Start">
    <div class="menu">
      <div>
        <p class="eyebrow" data-i18n="eyebrow">An escape room in your pocket</p>
        <h1 class="logo" data-i18n="logo">Room <span>404</span></h1>
        <p class="lede" data-i18n="lede"></p>
        <div class="cta-row">
          <button class="btn" id="btnContinue" type="button" data-i18n="continue" hidden>Continue</button>
          <button class="btn" id="btnNew" type="button">Check in</button>
          <button class="btn" id="btnCh2" type="button" data-i18n="ch2Btn" hidden>Chapter 2</button>
        </div>
        <div class="sub-row">
          <button class="link-btn" id="btnLang" type="button" lang="de">Deutsch</button>
          <a class="link-btn" data-hub href="https://lennify44.github.io/rooftop-roulette/arcade/" target="_blank" rel="noopener" data-i18n="allGames">All games</a>
        </div>
      </div>
      <div class="side">
        <h2 class="label" data-i18n="howTitle">How to play</h2>
        <p class="tip" data-i18n="howText"></p>
        <h2 class="label" style="margin-top:8px"><span data-i18n="lbTitle">Fastest escapes</span> <span id="lbWho"></span></h2>
        <div class="lb-tabs" id="lbTabs"><button type="button" data-lb="alltime" aria-pressed="true" data-i18n="allTime">All time</button><button type="button" data-lb="daily" aria-pressed="false" data-i18n="today">Today</button></div>
        <ol class="toplist" id="lbList"><li class="none">…</li></ol>
      </div>
    </div>
  </section>

  <section class="screen" id="screenEnd" aria-label="The end" hidden>
    <div class="menu">
      <div>
        <p class="eyebrow" id="endEyebrow"></p>
        <h1 class="logo" id="endTitle" style="font-size: clamp(44px, 9vw, 90px)"></h1>
        <p class="lede" id="endText"></p>
        <div class="cta-row"><button class="btn" id="btnNextCh" type="button" data-i18n="nextCh" hidden>On to chapter 2</button><button class="btn" id="btnEndNew" type="button" data-i18n="playAgain">Play again</button><button class="link-btn" id="btnOvertime" type="button" data-i18n="overtimeBtn" hidden>Keep searching (overtime)</button></div>
        <dl class="stats"><div><dt data-i18n="timeLeft">Time left</dt><dd id="endLeft">0:00</dd></div><div><dt data-i18n="hintsStat">Hints</dt><dd id="endHints">0</dd></div><div><dt data-i18n="bestStat">Best</dt><dd id="endBest">–</dd></div></dl>
      </div>
      <div class="side">
        <div class="lb-post" id="lbPost" hidden>
          <label for="lbName" data-i18n="lbName">Your name on the leaderboard</label>
          <div class="lb-row"><input id="lbName" maxlength="16" autocomplete="nickname" spellcheck="false"><button class="link-btn" id="lbSend" type="button" data-i18n="lbSend">Post time</button></div>
        </div>
        <p class="tip" id="lbResult"></p>
      </div>
    </div>
  </section>
</div>

<script>

function mk(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (tag === 'button') e.type = 'button'; return e; }

// ---------- texts: English and German. A function entry takes arguments, an array entry is a random pick.

    menu: 'Menu', turnL: 'Turn left', turnR: 'Turn right', inventory: 'Inventory', soundOn: 'Sound on', soundOff: 'Sound off',
    empty: 'Your pockets are empty.', minLeft: (n) => `${n} min left`, overtime: 'OVERTIME', overtimeLeft: 'checkout was at 12:00',

// ---------- inventory
function renderInv() {
  const box = $('inv'); box.innerHTML = '';
  if (!S.inv.length) { box.appendChild(mk('span', 'empty', esc(t('empty')))); return; }
  for (const id of S.inv) {
    const it = item(id);
    const b = mk('button', `item${justGot === id ? ' new' : ''}`, `<span aria-hidden="true">${it.icon}</span><small>${esc(it.name)}${it.note ? `<br>${esc(it.note)}` : ''}</small>`);
    b.setAttribute('aria-pressed', String(S.sel === id)); b.setAttribute('aria-label', `${it.name}${it.note ? ', ' + it.note : ''}`); b.setAttribute('data-item', id);
    b.addEventListener('click', () => tapItem(id));
    box.appendChild(b);
  }
  justGot = null;
}
function tapItem(id) {
  Sound.init();
  if (S.sel === id) { S.sel = null; say(esc(item(id).desc)); }
  else if (S.sel) { combine(S.sel, id); }
  else { S.sel = id; say(`${esc(item(id).desc)} ${t('useWhere')}`); Sound.click(); }
  renderInv();
}
function combine(a, b) {
  const pair = [a, b].sort().join('+');
  if (pair === 'batteries+remoteDead') { take('batteries'); take('remoteDead'); give('remote'); S.f.remoteWorks = true; S.sel = null; say(t('combined')); }
  else if (a === 'chocolate' || b === 'chocolate') { S.sel = null; say(t('chocCombine')); Sound.nope(); }
  else { S.sel = null; say(t('combineFail')); Sound.nope(); }
  save();
}

// ---------- close-up panel
let modalOnClose = null;
function openModal(title, html, setup, onClose) {
  $('mTitle').textContent = title; $('mBody').innerHTML = html; $('modal').hidden = false; modalOnClose = onClose || null;
  if (setup) setup($('mBody'));
}
function closeModal() { $('modal').hidden = true; const f = modalOnClose; modalOnClose = null; if (f) f(); renderScene(); }
$('mClose').addEventListener('click', closeModal);
// a button inside a close-up; act is a language-independent name for it
function act(box, actName, label, fn, cls = 'chip') { const c = mk('button', cls, label); c.setAttribute('data-act', actName); c.addEventListener('click', () => fn(c)); box.appendChild(c); return c; }

// ---------- interactions
function tapHot(h) {
  Sound.init();
  const sel = S.sel;
  if (sel && useItem(sel, h)) { save(); renderScene(); renderInv(); return; }
  if (sel) { S.sel = null; renderInv(); }
  const H = HOTS[h];
  if (H) H(); else say(t('nothing'));
  save(); renderScene();
}

['401', '402', '403', '405', '406', '407'].forEach((n, i) => { HOTS['d' + n] = () => say(T().doors[i]); });

function useItem(id, h) {
  if (S.ch === 2) return useItem2(id, h);
  const f = S.f;
  if (id === 'remote' && h === 'tv') { f.tvOn = true; S.sel = null; Sound.tv(); openTv(); say(t('tvOn')); return true; }
  if (id === 'remoteDead' && h === 'tv') { S.sel = null; Sound.nope(); say(t('tvNeedsPower')); return true; }
  if (id === 'tray' && h === 'sink') { take('tray'); give('key'); f.melted = true; Sound.water(); say(t('melt')); return true; }
  if (id === 'key' && h === 'wardrobe') { take('key'); f.wardrobeOpen = true; Sound.unlock(); say(t('wardrobeOpened')); openWardrobe(); return true; }
  if (id === 'handle' && h === 'door') { take('handle'); f.doorOpen = true; Sound.door(); say(t('doorOpened')); return true; }
  if (id === 'uv' && h === 'painting') { S.sel = null; say(t('uvPainting')); return true; }
  if (id === 'uv' && h === 'mirror') { S.sel = null; say(t('uvMirror')); return true; }
  if (id === 'uv' && h === 'wardrobe' && f.wardrobeOpen) { S.sel = null; openSafe(true); return true; }
  if (id === 'chocolate') { take('chocolate'); S.left = Math.min(TOTAL, S.left + 60); say(t('ateChoc')); return true; }
  if (id === 'voucher' && h === 'panel') { S.sel = null; openPanel(); say(t('voucherPanel')); return true; }
  return false;
}

// ---------- close-ups with puzzles
function openClock() {
  const draw = (b) => {
    b.querySelector('#now').textContent = hotel();
    b.querySelector('#al').textContent = `AL ${String(S.alarm[0]).padStart(2, '0')}:${String(S.alarm[1]).padStart(2, '0')}`;
    b.querySelector('#al').classList.toggle('ok', S.alarmOn);
    b.querySelector('#onoff').textContent = S.alarmOn ? t('alarmOn') : t('alarmOff');
  };
  openModal(t('clockTitle'), `<div class="row"><div class="display" id="now">11:15</div></div><div class="row"><div class="display" id="al">AL 06:00</div></div><div class="row"><button class="chip" id="hr" type="button">${esc(t('hourPlus'))}</button><button class="chip" id="mn" type="button">${esc(t('minPlus'))}</button><button class="chip" id="onoff" type="button"></button></div><p class="tip" id="clockMsg">${esc(t('clockInfo'))}</p>`, (b) => {
    draw(b);
    const changed = () => {
      Sound.click(); draw(b);
      if (S.alarmOn && S.alarm[0] === S.breakfast[0] && S.alarm[1] === S.breakfast[1] && !S.f.drawerOpen) {
        S.f.drawerOpen = true; Sound.beep(); b.querySelector('#clockMsg').textContent = t('ring');
        say(t('ringSay'));
      } else if (S.alarmOn && !S.f.drawerOpen) b.querySelector('#clockMsg').textContent = t('alarmNothing');
      save();
    };
    b.querySelector('#hr').addEventListener('click', () => { S.alarm[0] = (S.alarm[0] + 1) % 24; changed(); });
    b.querySelector('#mn').addEventListener('click', () => { S.alarm[1] = (S.alarm[1] + 15) % 60; changed(); });
    b.querySelector('#onoff').addEventListener('click', () => { S.alarmOn = !S.alarmOn; changed(); });
  });
}
function openTv() {
  const screen = () => {
    const ch = S.tvCh || '1';
    if (ch === '404') S.f.saw404 = true;
    const text = T().channels[ch];
    return text ? ['', text] : ['static', t('noSignal', esc(ch))];
  };
  openModal(t('tvTitle'), '<div class="tvscreen" id="tvs"></div><div class="row"><div class="display" id="tvin">--</div></div><div class="keypad" id="tvk"></div>', (b) => {
    let typed = '';
    const show = () => { const [cls, html] = screen(); const s = b.querySelector('#tvs'); s.className = `tvscreen ${cls}`; s.innerHTML = html; b.querySelector('#tvin').textContent = typed || S.tvCh || '1'; };
    show();
    const pad = b.querySelector('#tvk');
    for (const k of ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'OK']) {
      const btn = mk('button', `key${k === 'C' || k === 'OK' ? ' wide' : ''}`, k);
      btn.addEventListener('click', () => {
        Sound.click();
        if (k === 'C') typed = '';

      });
      pad.appendChild(btn);
    }
  });
}

function flipFuse(lo, i) {
  const r = Math.floor(i / 3), c = i % 3, out = lo.slice();
  for (const [dr, dc] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) { const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < 3 && cc >= 0 && cc < 3) out[rr * 3 + cc] = !out[rr * 3 + cc]; }
  return out;
}

function openCashOpen() {
  openModal(t('cashTitle'), `<p>${t('cashOpenBody')}</p><div class="chips" id="ca"></div>`, (b) => {
    const box = b.querySelector('#ca');
    if (!S.f.cardTaken) act(box, 'card', t('takeCard'), (c) => { S.f.cardTaken = true; give('card'); c.remove(); say(t('tookCard')); }, 'chip take');
    act(box, 'memo', t('readMemo'), () => openNote('memo'));
    if (S.f.cardTaken) box.appendChild(mk('span', '', esc(t('cashEmpty'))));
  });
}
function openFuse() {
  openModal(t('fuseTitle'), `<p>${t('fuseBody')}</p><div class="lo" id="lo"></div><p class="tip" id="loMsg"></p>`, (b) => {
    const grid = b.querySelector('#lo'), msg = b.querySelector('#loMsg');
    const draw = () => {
      grid.innerHTML = '';
      S.lo.forEach((on, i) => {
        const c = mk('button', on ? 'on' : ''); c.setAttribute('data-fuse', String(i)); c.setAttribute('aria-label', `${t('fuseWord')} ${i + 1}, ${on ? t('lit') : t('dark')}`);
        c.addEventListener('click', () => press(i)); grid.appendChild(c);
      });
    };
    const press = (i) => {
      if (S.f.power) return;
      S.lo = flipFuse(S.lo, i); Sound.click(); draw();
      if (S.lo.every(Boolean)) { S.f.power = true; Sound.unlock(); msg.textContent = t('fuseDone'); say(t('fuseDone')); }
      save();
    };
    draw(); if (S.f.power) msg.textContent = t('fuseDone');
  });
}
function openVend() {
  const emo = ['🥔', '🍬', '🥜', '🍭', '🥤', '🍪'];
  openModal(t('vendTitle'), `<p>${t('vendBody')}</p><div class="vend" id="vm"></div><p class="tip" id="vMsg">${S.f.coinIn ? esc(t('vendCoin')) : ''}</p>`, (b) => {
    const box = b.querySelector('#vm'), msg = b.querySelector('#vMsg');
    for (let i = 0; i < 6; i++) {
      const c = mk('button', 'chip', `<span style="font-size:26px">${emo[i]}</span><small>${esc(T().vendNames[i])}</small><b>${esc(t('cur', S.vprices[i]))}</b>`);
      c.setAttribute('data-slot', String(i));
      c.addEventListener('click', () => {
        if (S.f.btn4) { msg.textContent = t('vendDone'); return; }
        if (!S.f.coinIn) { Sound.nope(); msg.textContent = t('vendNoCoin'); return; }
        if (i === S.vslot) { S.f.coinIn = false; S.f.btn4 = true; give('button4'); Sound.unlock(); msg.textContent = t('vendWin'); say(t('vendWin')); }
        else { Sound.nope(); msg.textContent = t('vendFail'); }
        save();
      });
      box.appendChild(c);
    }
  });
}
function openLiftPanel() {
  openModal(t('liftTitle'), `<p>${t('liftBody')}</p><div class="row"><div class="display" id="ld">---</div></div><div class="keypad" id="lk"></div><p class="tip" id="lMsg"></p>`, (b) => {
    let typed = '';
    const show = (ok) => { const d = b.querySelector('#ld'); d.textContent = (typed + '---').slice(0, 3); d.classList.toggle('ok', !!ok); };
    const pad = b.querySelector('#lk'), msg = b.querySelector('#lMsg');
    for (const k of ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'OK']) {
      const btn = mk('button', `key${k === 'C' || k === 'OK' ? ' wide' : ''}`, k);
      btn.addEventListener('click', () => {
        Sound.click();
        if (k === 'C') typed = '';
        else if (k === 'OK') {
          if (typed === String(S.val)) { S.f.liftOpen = true; show(true); Sound.unlock(); Sound.door(); msg.textContent = t('liftOpened'); say(t('liftOpened')); save(); setTimeout(() => { if (!$('modal').hidden) { closeModal(); go('lift'); say(t('liftOpened')); } }, 1100); return; }
          Sound.nope(); msg.textContent = t('liftWrong'); typed = '';
        } else if (typed.length < 3) typed += k;
        show();
      });
      pad.appendChild(btn);
    }
    show();
  });
}

Object.assign(HOTS, {
  laundrydoor: () => { go('laundry'); say(t('laundryTo')); },
  c2back: () => { go('c2hall'); say(t('back2')); },
  mat: () => openNote('sam'),
  poster: () => openModal(t('posterTitle'), t('poster')),
  chute: () => { Sound.squeak(); say(t('chute')); },
  cart: () => { if (!S.f.cartNote) { S.f.cartNote = true; openNote('cleaner'); say(t('cart')); } else say(t('cartAgain')); },
  washer: () => { Sound.water(); if (!S.f.coin) { S.f.coin = true; give('coin'); say(t('washerCoin')); } else say(t('washerAgain')); },
  lfcab: () => openLostFound(),
  recdoor: () => { if (S.f.recOpen) { go('recep'); say(t('recTo')); } else say(t('recLocked')); },
  pigeon: () => openPigeon(),
  keys: () => openModal(t('keysTitle'), `<p>${t('keysBody')}</p>${keyBoard(true)}`),
  cashdrawer: () => openCash(),
  bell: () => { Sound.beep(); say(t('bell')); },
  fuse: () => openFuse(),
  vend: () => openVend(),
  lift: () => {
    if (!S.f.power) { Sound.nope(); say(t('liftDead')); }
    else if (!S.f.cardUsed) say(t('liftNeedCard'));
    else if (!S.f.liftOpen) openLiftPanel();
    else { go('lift'); say(t('liftHere')); }
  },
  liftnote: () => openNote('lift'),
  liftsock: () => say(t('sockEmpty')),
});
function useItem2(id, h) {
  const f = S.f;
  if (id === 'rkey' && h === 'recdoor') { take('rkey'); f.recOpen = true; Sound.unlock(); say(t('recOpened')); return true; }
  if (id === 'coin' && h === 'vend') { take('coin'); f.coinIn = true; Sound.click(); say(t('vendCoin')); openVend(); return true; }
  if (id === 'card' && h === 'lift') {
    S.sel = null;
    if (!f.power) { Sound.nope(); say(t('liftDark')); return true; }
    f.cardUsed = true; Sound.unlock(); say(t('cardOk'));
    if (!f.liftOpen) openLiftPanel(); else { go('lift'); }
    return true;
  }
  if (id === 'button4' && h === 'liftsock') { take('button4'); f.btnPlaced = true; Sound.unlock(); say(t('btnPlaced')); setTimeout(escape2, 1400); return true; }
  return false;
}
function escape2() {
  if (!S || S.done || S.ch !== 2) return;
  S.done = true; paused = true; Sound.win();
  const left = S.overtime ? 0 : Math.floor(S.left);
  if (!S.overtime) profile.best2 = Math.max(profile.best2 || 0, left);
  profile.ch2done = true; saveProfile(); store.del(SAVE_KEY);
  $('lbPost').hidden = true; $('lbResult').textContent = '';
  showEnd(S.overtime ? t('win2EyebrowOver') : t('win2Eyebrow'), t('win2Title'), t('win2Text', mmss(left), S.hints, noteCount()), left, false);
}
function newGame2() { S = freshState2(); save(); begin(); say(t('start2')); }

// ---------- hints: the first unfinished goal decides which hints are offered
const GOALS = [
  ['remote', () => S.f.remote], ['batteries', () => S.f.batteries], ['combine', () => S.f.remoteWorks], ['tv', () => S.f.tvOn],
  ['mirror', () => S.f.mirrorRead], ['drawer', () => S.f.drawerOpen], ['uv', () => S.f.uvTaken], ['tray', () => S.f.trayTaken],
  ['melt', () => S.f.melted], ['wardrobe', () => S.f.wardrobeOpen], ['safe', () => S.f.safeOpen], ['handle', () => S.f.handleTaken],
  ['door', () => S.f.doorOpen], ['refresh', () => S.f.refreshed], ['exit', () => S.done],
].map(([id, done]) => ({ id, done, get hints() { return T().hints[id]; } }));
const GOALS2 = [
  ['c2_lf', () => S.f.lfSolved], ['c2_door', () => S.f.recOpen], ['c2_post', () => S.f.cardTaken], ['c2_power', () => S.f.power], ['c2_coin', () => S.f.coin || S.f.btn4],
  ['c2_vend', () => S.f.btn4], ['c2_card', () => S.f.cardUsed], ['c2_bin', () => S.f.liftOpen], ['c2_place', () => S.done],
].map(([id, done]) => ({ id, done, get hints() { return T().hints[id]; } }));
function openHints() {
  const g = (S.ch === 2 ? GOALS2 : GOALS).find((x) => !x.done());
  if (!g) return;
  const seen = S.hintSeen[g.id] || 0;
  const text = (h) => (typeof h === 'function' ? h(g.id === 'c2_post' ? S.word : g.id === 'c2_bin' ? String(S.val) : code().join('')) : h);
  openModal(t('hintsTitle'), `<p>${t('hintsIntro')}</p><ol class="hints" id="hl">${g.hints.slice(0, seen).map((h) => `<li>${esc(text(h))}</li>`).join('')}</ol><div class="row" id="hr"></div>`, (b) => {
    const row = b.querySelector('#hr');
    if (seen < g.hints.length) act(row, 'hint', seen ? t('hintMore') : t('hintFirst'), () => { S.hintSeen[g.id] = seen + 1; S.hints++; S.left -= HINT_COST; save(); tickClock(); openHints(); }, 'btn');
    else row.appendChild(mk('span', 'tip', esc(t('hintLast'))));
  });
}
$('btnHint').addEventListener('click', () => { Sound.init(); openHints(); });

// ---------- clock and endings
let lastTick = 0, paused = true;
function tickClock() {
  $('clock').textContent = S.overtime ? t('overtime') : hotel();
  $('left').textContent = S.overtime ? t('overtimeLeft') : t('minLeft', Math.ceil(S.left / 60));
  $('clockBox').classList.toggle('low', !S.overtime && S.left < 300);
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!S || paused || S.done) { lastTick = now; return; }
  const dt = Math.min(1, (now - (lastTick || now)) / 1000); lastTick = now;
  if (!S.overtime) {
    const before = Math.ceil(S.left / 60);
    S.left -= dt;
    if (Math.ceil(S.left / 60) !== before) { tickClock(); if (S.view === 'bed' && $('modal').hidden) renderScene(); save(); }
    if (S.left <= 0) { S.left = 0; timeUp(); }
  }
  // steam builds while the shower runs and slowly fades when it is off
  const target = S.f.showerOn ? 1 : 0, old = S.steam;
  S.steam += (target - S.steam) * dt * (S.f.showerOn ? 0.45 : 0.12);
  if (S.view === 'bath' && $('modal').hidden && Math.abs(S.steam - old) > 0.0005 && Math.floor(S.steam * 40) !== Math.floor(old * 40)) renderScene();
}
function showEnd(eyebrow, title, text, left, overtimeOffer) {
  $('endEyebrow').textContent = eyebrow; $('endTitle').textContent = title; $('endText').textContent = text;
  $('endLeft').textContent = mmss(left); $('endHints').textContent = S.hints; { const bt = S.ch === 2 ? profile.best2 : profile.best; $('endBest').textContent = bt ? mmss(bt) : '–'; }
  $('btnNextCh').hidden = !(S.done && S.ch !== 2); $('btnEndNew').textContent = t('playAgain');
  $('btnOvertime').hidden = !overtimeOffer; $('screenEnd').hidden = false;
}
function timeUp() {
  if (S.done || S.overtime) return;
  paused = true; Sound.lose();
  $('modal').hidden = true; $('lbPost').hidden = true; $('lbResult').textContent = '';
  save();
  showEnd(t(S.ch === 2 ? 'up2Eyebrow' : 'upEyebrow'), t(S.ch === 2 ? 'up2Title' : 'upTitle'), t(S.ch === 2 ? 'up2Text' : 'upText'), 0, true);
}
function escape() {
  S.done = true; paused = true; Sound.win();
  const left = S.overtime ? 0 : Math.floor(S.left);
  if (!S.overtime) { profile.best = Math.max(profile.best, left); profile.escapes++; }
  profile.ch1done = true; saveProfile();
  store.del(SAVE_KEY);
  showEnd(S.overtime ? t('winEyebrowOver') : t('winEyebrow', hotel()), t('winTitle'), S.overtime ? t('winTextOver') : t('winText', mmss(left), S.hints), left, false);
  lbAfter(S.overtime ? 0 : left, S.hints);
}
$('btnOvertime').addEventListener('click', () => { S.overtime = true; save(); $('screenEnd').hidden = true; paused = false; tickClock(); say(t('overtimeSay')); });
$('btnEndNew').addEventListener('click', () => (S && S.ch === 2 ? newGame2() : newGame()));
$('btnNextCh').addEventListener('click', () => newGame2());

// ---------- start, menu, saving, language
function begin() {
  Sound.init();
  $('screenStart').hidden = true; $('screenEnd').hidden = true; paused = false; lastTick = 0;
  renderScene(); renderInv(); tickClock();
}
function newGame() { S = freshState(); save(); begin(); say(t('start')); }
// starting over needs a second tap when there is a saved game (a confirm() dialog can be blocked inside embedded previews)
let armedNew = 0;
$('btnNew').addEventListener('click', () => {
  if (store.get(SAVE_KEY, null) && Date.now() - armedNew > 4000) { armedNew = Date.now(); $('btnNew').textContent = t('confirmNew'); return; }
  armedNew = 0; newGame();
});
let armedCh2 = 0;
$('btnCh2').addEventListener('click', () => {
  const sv = store.get(SAVE_KEY, null);
  if (sv && !sv.done && Date.now() - armedCh2 > 4000) { armedCh2 = Date.now(); $('btnCh2').textContent = t('confirmNew'); return; }
  armedCh2 = 0; newGame2();
});
$('btnContinue').addEventListener('click', () => { S = store.get(SAVE_KEY, null); if (!S || S.done) { newGame(); return; } begin(); say(t('back')); });
$('btnMenu').addEventListener('click', () => { paused = true; save(); showStart(); });
$('navL').addEventListener('click', () => go(S.view === 'bed' ? 'desk' : 'bed'));
$('navR').addEventListener('click', () => go(S.view === 'bed' ? 'desk' : 'bed'));
$('scene').addEventListener('click', (e) => { const h = e.target.closest('[data-hot]'); if (h) tapHot(h.getAttribute('data-hot')); });
$('scene').addEventListener('keydown', (e) => { if (e.key !== 'Enter' && e.key !== ' ') return; const h = e.target.closest('[data-hot]'); if (h) { e.preventDefault(); tapHot(h.getAttribute('data-hot')); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) { paused = true; save(); } else if (S && $('screenStart').hidden && $('screenEnd').hidden) { paused = false; lastTick = 0; } });
document.addEventListener('gesturestart', (e) => e.preventDefault());
function applyLang() {
  document.documentElement.lang = lang; document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.innerHTML = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
  $('btnLang').textContent = t('otherLang'); $('btnLang').setAttribute('lang', lang === 'de' ? 'en' : 'de');
  renderMute(); renderScene(); renderInv(); tickClock();
}
$('btnLang').addEventListener('click', () => { lang = lang === 'de' ? 'en' : 'de'; profile.lang = lang; saveProfile(); applyLang(); showStart(); });
function showStart() {
  const saved = store.get(SAVE_KEY, null);
  $('btnContinue').hidden = !saved || saved.done;
  $('btnNew').textContent = saved && !saved.done ? t('newGame') : t('checkIn'); armedNew = 0;
  $('btnCh2').hidden = !profile.ch1done; $('btnCh2').textContent = t('ch2Btn'); armedCh2 = 0;
  $('screenStart').hidden = false; $('screenEnd').hidden = true;
  renderLeaderboard();
}

// ---------- leaderboard (the shared Cloudflare Worker; score = seconds left at the escape)
const LEADERBOARD_URL = 'https://rooftop-leaderboard.rooftop-b71afd.workers.dev';
const PUBLIC_URL = 'https://lennify44.github.io/rooftop-roulette/room-404/';
const GAME_ID = 'room404';
const LB = { cache: null, at: 0, tab: 'alltime', posting: false };
const lbReachable = () => !!LEADERBOARD_URL && location.hostname === 'lennify44.github.io';
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function deviceId() { if (!profile.deviceId) { profile.deviceId = (Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g, '').slice(0, 20); saveProfile(); } return profile.deviceId; }
async function lbFetch(force) {
  if (!lbReachable()) return null;
  if (!force && LB.cache && Date.now() - LB.at < 30000) return LB.cache;
  try { const r = await fetch(`${LEADERBOARD_URL}/scores?game=${GAME_ID}&date=${todayKey()}`); if (!r.ok) return null; LB.cache = await r.json(); LB.at = Date.now(); return LB.cache; } catch (e) { return null; }
}
function lbNote(list, text, link) {
  list.textContent = ''; const li = mk('li', 'none'); li.textContent = text;
  if (link) { const a = document.createElement('a'); a.href = PUBLIC_URL + (lang === 'de' ? '?lang=de' : ''); a.target = '_blank'; a.rel = 'noopener'; a.textContent = t('lbOpen'); li.appendChild(a); }
  list.appendChild(li);
}
async function renderLeaderboard(force) {
  const list = $('lbList');
  $('lbWho').textContent = profile.name ? t('lbWho', profile.name) : '';
  $('lbTabs').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-lb') === LB.tab)));
  if (!lbReachable()) { lbNote(list, t('lbPublic'), true); return; }
  const data = await lbFetch(force);
  if (!data) { lbNote(list, t('lbFail')); return; }
  const rows = (LB.tab === 'daily' ? data.daily : data.alltime).slice(0, 10);
  if (!rows.length) { lbNote(list, LB.tab === 'daily' ? t('lbEmptyDaily') : t('lbEmpty')); return; }
  list.textContent = '';
  rows.forEach((r, i) => {
    const li = mk('li', r.id === profile.deviceId ? 'me' : '');
    const rank = mk('b'); rank.textContent = String(i + 1); li.appendChild(rank);
    for (const text of [r.name, t('lbLeft', mmss(r.score)), t('lbHints', r.dist)]) { const el = mk('span'); el.textContent = text; li.appendChild(el); }
    list.appendChild(li);
  });
}
$('lbTabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; LB.tab = b.getAttribute('data-lb'); renderLeaderboard(); });
let lbLast = null;
function lbAfter(score, hints) {
  const box = $('lbPost'), out = $('lbResult'); out.textContent = ''; box.hidden = true;
  if (!lbReachable() || score <= 0) return;
  lbLast = { game: GAME_ID, score, dist: hints, daily: true, date: todayKey() };
  $('lbName').value = profile.name; box.hidden = false;
  if (profile.name) lbSend();
}
async function lbSend() {
  const name = $('lbName').value.trim().replace(/[^\p{L}\p{N} _.\-]/gu, '').slice(0, 16), out = $('lbResult');
  if (!name) { out.textContent = t('lbNeedName'); $('lbName').focus(); return; }
  if (!lbLast || LB.posting) return;
  if (name !== profile.name) { profile.name = name; saveProfile(); }
  LB.posting = true; out.textContent = t('lbPosting');
  try {
    const r = await fetch(`${LEADERBOARD_URL}/scores`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: deviceId(), name, ...lbLast }) });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) out.textContent = r.status === 429 ? t('lbTooFast') : t('lbRejected');
    else { const rk = res.rank || {}; out.textContent = t('lbRank', rk.alltime, rk.daily); lbLast = null; LB.at = 0; }
  } catch (e) { out.textContent = t('lbFail'); }
  LB.posting = false;
}
$('lbSend').addEventListener('click', lbSend);
$('lbName').addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); lbSend(); } });

// the game browser link opens in the same tab on the public site (keeps a home-screen app in one window)
document.querySelectorAll('a[data-hub]').forEach((a) => { if (location.hostname === 'lennify44.github.io') a.removeAttribute('target'); });
S = store.get(SAVE_KEY, null) || freshState();
applyLang(); say('');
showStart();
requestAnimationFrame(frame);
})();
