<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="An incremental where every new currency is a new game: machines, a mine, a capacitor, and more layers to come.">
<meta name="theme-color" content="#110e22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" href="../icon-192.png">

<style>

<title>Layer Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  /* Layout: layer map on top, then the active layer's upgrade web (a pannable 2D plane with fog, minimap and a node
     detail sheet), the layer's own mechanic below it, Layer Up button pinned to the bottom; ⚙️ opens stats/settings */
  --night: #0f0b1e; --chalk: #fff7ee; --haze: #c4bce0;
  --coin: #ffc93c; --gem: #3ef2ff; --volt: #b6ff3b; --lab: #ff4fa3;
  --acc: var(--coin);
  --font-display: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  --font-body: "Barlow", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { background: var(--night); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--chalk); font-family: var(--font-body); font-size: 15px; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(ellipse at 50% -10%, color-mix(in srgb, var(--acc) 38%, #1a0f3a), var(--night) 62%); transition: background 0.6s; }
#app { max-width: 820px; margin: 0 auto; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 120px max(12px, env(safe-area-inset-left)); }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.big { font-family: var(--font-display); font-weight: 900; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--acc); text-shadow: 0 0 22px color-mix(in srgb, var(--acc) 50%, transparent); }
.big.bump { animation: bump 0.25s ease-out; }
@keyframes bump { 40% { transform: scale(1.12); } }
.rate { font-family: var(--font-mono); font-size: 13px; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { padding: 2px 7px; border-radius: 8px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: #120c22; background: var(--c); }
.tbtns { display: flex; gap: 6px; }
.icon-btn { width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.12); color: var(--chalk); font-size: 18px; cursor: pointer; }
.map { display: flex; gap: 6px; margin: 12px 0; overflow-x: auto; padding-bottom: 4px; }
.lay { flex: 1 0 100px; min-height: 66px; padding: 6px 8px; border-radius: 14px; border: 3px solid var(--c); background: color-mix(in srgb, var(--c) 18%, #140e28); color: var(--chalk); text-align: left; cursor: pointer; font-family: var(--font-body); }
.lay b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 19px; text-transform: uppercase; color: var(--c); }
.lay small { font-family: var(--font-mono); font-size: 11px; }
.lay[aria-pressed="true"] { background: var(--c); color: #120c22; box-shadow: 0 0 20px color-mix(in srgb, var(--c) 60%, transparent); }
.lay[aria-pressed="true"] b { color: #120c22; }
.lay.locked { opacity: 0.35; cursor: default; border-style: dashed; }
.card { padding: 12px; border-radius: 18px; background: color-mix(in srgb, var(--acc) 10%, #17112e); border: 2px solid color-mix(in srgb, var(--acc) 35%, transparent); margin-bottom: 10px; }
.card h2 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 900; font-size: 26px; text-transform: uppercase; color: var(--acc); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h2 small { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--chalk); text-transform: none; }
.card p { margin: 0 0 8px; color: var(--haze); font-size: 13px; }
/* the web */
.view { position: relative; height: min(58vh, 520px); border-radius: 14px; overflow: hidden; touch-action: none; cursor: grab; background:
  radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--acc) 12%, transparent), transparent 70%), repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 48px), repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 48px), #0c0818; }
.plane { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.plane svg { position: absolute; left: -4000px; top: -4000px; width: 8000px; height: 8000px; pointer-events: none; overflow: visible; }
.nd { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 16px; border: 3px solid var(--c); background: #140e28; color: var(--chalk); display: grid; place-items: center; align-content: center; gap: 0; font-family: var(--font-display); font-weight: 900; cursor: pointer; padding: 0; }
.nd i { font-style: normal; font-size: 24px; line-height: 1; }
.nd small { font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
.nd.notable { width: 82px; height: 82px; margin: -41px 0 0 -41px; border-radius: 50%; border-width: 4px; }
.nd.key { width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 22px; border-width: 5px; transform: rotate(45deg); }
.nd.key > * { transform: rotate(-45deg); }
.nd.inf { border-style: double; border-width: 6px; }
.nd.core { width: 88px; height: 88px; margin: -44px 0 0 -44px; border-radius: 50%; border-width: 5px; }
.nd.own { background: color-mix(in srgb, var(--c) 45%, #140e28); }
.nd.full { background: var(--c); color: #120c22; }
.nd.can { box-shadow: 0 0 16px var(--c); animation: glow 1.1s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 30px var(--c); } }
.nd.fog { border-style: dashed; opacity: 0.45; background: #0c0818; }
.nd.sel { outline: 3px solid #fff; outline-offset: 4px; }
.nd.got { animation: got 0.5s ease-out; }
@keyframes got { 30% { scale: 1.2; } }
.vbtns { position: absolute; right: 8px; top: 8px; display: grid; gap: 6px; z-index: 2; }
.vbtns button { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--acc); background: rgba(15,11,30,0.85); color: var(--chalk); font-size: 20px; font-weight: 700; cursor: pointer; }
.mini { position: absolute; left: 8px; bottom: 8px; width: 96px; height: 96px; border-radius: 10px; border: 2px solid color-mix(in srgb, var(--acc) 60%, transparent); background: rgba(15,11,30,0.85); z-index: 2; pointer-events: none; }
.disc { position: absolute; left: 8px; top: 8px; z-index: 2; padding: 3px 8px; border-radius: 8px; background: rgba(15,11,30,0.85); font-family: var(--font-mono); font-size: 12px; pointer-events: none; }
.sheet { margin-top: 10px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 10px; border-radius: 14px; background: rgba(0,0,0,0.3); border: 2px solid var(--c, var(--acc)); }
.sheet b { font-family: var(--font-display); font-weight: 900; font-size: 22px; text-transform: uppercase; color: var(--c, var(--acc)); }
.sheet .kd { font-family: var(--font-mono); font-size: 11px; color: var(--haze); margin-left: 6px; }
.sheet .ds { font-size: 13px; color: var(--haze); }
.sheet .nw { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.sheet .btns { display: flex; gap: 6px; }
.bbtn { min-width: 84px; min-height: 52px; padding: 2px 10px; border: 0; border-radius: 12px; background: var(--c, var(--acc)); color: #120c22; font-family: var(--font-display); font-weight: 900; font-size: 18px; cursor: pointer; }
.bbtn small { display: block; font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
.bbtn.max { min-width: 56px; background: transparent; color: var(--c, var(--acc)); border: 2px solid var(--c, var(--acc)); }
.bbtn:disabled { opacity: 0.35; cursor: default; }
/* mine + capacitor */
.grid { display: grid; gap: 6px; margin: 8px 0; }
.tile { aspect-ratio: 1; border-radius: 12px; border: 2px dashed color-mix(in srgb, var(--gem) 50%, transparent); background: rgba(0,0,0,0.25); color: var(--chalk); font-size: 26px; cursor: pointer; position: relative; display: grid; place-items: center; }
.tile.full { border-style: solid; border-color: var(--gem); background: color-mix(in srgb, var(--gem) 22%, transparent); }
.tile small { position: absolute; bottom: 2px; right: 5px; font-family: var(--font-mono); font-size: 10px; color: var(--gem); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tool { min-height: 44px; padding: 4px 10px; border-radius: 12px; border: 2px solid var(--gem); background: transparent; color: var(--chalk); font-family: var(--font-display); font-weight: 900; font-size: 15px; cursor: pointer; }
.tool[aria-pressed="true"] { background: var(--gem); color: #102030; }
.tool:disabled { opacity: 0.3; }
.cap { height: 36px; border-radius: 18px; border: 2px solid var(--volt); background: rgba(0,0,0,0.4); overflow: hidden; position: relative; margin: 8px 0; }
.cap i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #6aff3b, var(--volt), #fff); }
.cap span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 13px; color: #fff; text-shadow: 0 1px 3px #000; }
.wide { width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: var(--acc); color: #120c22; font-family: var(--font-display); font-weight: 900; font-size: 22px; cursor: pointer; }
.wide:disabled { opacity: 0.35; cursor: default; }
.burst { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 6; padding: 6px 14px; border-radius: 999px; background: var(--volt); color: #1b2a00; font-family: var(--font-display); font-weight: 900; font-size: 18px; }
.upbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: linear-gradient(0deg, var(--night) 70%, transparent); display: flex; justify-content: center; }
.upbtn { width: 100%; max-width: 796px; min-height: 64px; border: 0; border-radius: 18px; background: linear-gradient(90deg, var(--acc), var(--nx, var(--lab))); color: #120c22; font-family: var(--font-display); font-weight: 900; font-size: 26px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 26px color-mix(in srgb, var(--nx, var(--lab)) 55%, transparent); }
.upbtn small { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; }
.upbtn:disabled { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); box-shadow: none; cursor: default; }
/* overlays */
.toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 12; width: max-content; max-width: 90%; padding: 10px 18px; border-radius: 14px; background: rgba(15,11,30,0.94); border: 3px solid var(--acc); text-align: center; font-family: var(--font-display); font-weight: 900; font-size: 22px; text-transform: uppercase; animation: tin 0.25s ease-out; pointer-events: none; }
.toast small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 13px; text-transform: none; color: var(--haze); }
@keyframes tin { from { transform: translateX(-50%) scale(0.6); opacity: 0; } }
.flash { position: fixed; inset: 0; z-index: 11; display: grid; place-items: center; animation: fl 1.8s ease-out forwards; pointer-events: none; }
.flash b { font-family: var(--font-display); font-weight: 900; font-size: clamp(48px, 14vw, 110px); color: #120c22; text-transform: uppercase; animation: zoom 1.8s ease-out forwards; text-align: center; line-height: 0.9; }
@keyframes fl { 70% { opacity: 1; } to { opacity: 0; } }
@keyframes zoom { from { transform: scale(0.3) rotate(-8deg); } 30% { transform: scale(1.1); } to { transform: scale(1.5); } }
.flash .stack { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); display: flex; flex-direction: column-reverse; gap: 6px; width: min(80vw, 420px); }
.flash .stack span { display: block; padding: 8px 14px; border-radius: 12px; background: var(--c); color: #120c22; font-family: var(--font-display); font-weight: 900; font-size: 22px; text-transform: uppercase; animation: rise 0.5s ease-out backwards; animation-delay: calc(var(--i) * 0.18s); box-shadow: 0 0 24px var(--c); }
@keyframes rise { from { transform: translateY(80px) scale(0.6); opacity: 0; } }
.fly { position: fixed; z-index: 10; pointer-events: none; font-family: var(--font-display); font-weight: 900; font-size: 26px; text-shadow: 0 2px 0 rgba(0,0,0,0.6); transition: transform 0.7s cubic-bezier(.3,.7,.2,1), opacity 0.7s; }
.spark { position: fixed; z-index: 10; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; transition: transform 0.6s ease-out, opacity 0.6s; }
.over { position: fixed; inset: 0; z-index: 9; background: rgba(10,7,22,0.94); overflow-y: auto; padding: max(14px, env(safe-area-inset-top)) 14px 40px; }
.over .box { max-width: 760px; margin: 0 auto; }
.over h2 { font-family: var(--font-display); font-weight: 900; font-size: 30px; text-transform: uppercase; margin: 10px 0 6px; color: var(--acc); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stats div { padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,0.06); }
.stats dt { font-family: var(--font-mono); font-size: 11px; color: var(--haze); text-transform: uppercase; }
.stats dd { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 24px; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.ach { padding: 8px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); }
.ach b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 16px; text-transform: uppercase; }
.ach span { font-size: 12px; color: var(--haze); }
.ach.on { border-color: var(--coin); background: color-mix(in srgb, var(--coin) 18%, transparent); }
.opt { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.opt button, .opt a { min-height: 44px; padding: 6px 14px; border-radius: 12px; border: 2px solid var(--acc); background: transparent; color: var(--chalk); font-family: var(--font-display); font-weight: 900; font-size: 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.opt button[aria-pressed="true"] { background: var(--acc); color: #120c22; }
textarea { width: 100%; min-height: 80px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); color: var(--chalk); font-family: var(--font-mono); font-size: 11px; padding: 8px; }
input[type=text] { min-height: 44px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.4); color: var(--chalk); font: 600 16px var(--font-body); padding: 6px 10px; }
.foot { display: flex; justify-content: center; gap: 18px; margin-top: 12px; }
.link-btn { min-height: 44px; border: 0; background: none; color: var(--chalk); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
@media (orientation: landscape) and (max-height: 520px) { .view { height: 74vh; } .big { font-size: 32px; } .map { margin: 6px 0; } .lay { min-height: 40px; padding: 3px 8px; } .lay small, .webp { display: none; } .chips { margin-top: 3px; } .upbtn { min-height: 52px; font-size: 20px; } .upbtn small { display: none; } }
</style>

<body>
<!-- source:body -->
<div id="app">
  <div class="top">
    <div><div class="big" id="main">🪙 0</div><div class="rate" id="rate">0 / s</div></div>
    <div class="tbtns"><button class="icon-btn" id="btnMenu" type="button" aria-label="Stats, achievements and settings">⚙️</button><button class="icon-btn" id="btnMute" type="button" aria-label="Sound on">🔊</button></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="map" id="map" aria-label="Layers"></div>
  <div id="screen"></div>
  <div class="foot"><a class="link-btn" data-hub href="https://lennify44.github.io/rooftop-roulette/arcade/" target="_blank" rel="noopener">All games</a></div>
</div>
<div class="upbar"><button class="upbtn" id="btnUp" type="button" disabled>Layer up</button></div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* blocked */ } } };
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
const log10 = (n) => Math.log10(Math.max(1, n));

// ---------- save
const SAVE = 'layer-up-save-v3';
const fresh = () => ({ coins: 0, run: 0, life: 0, runT: 0, gems: 0, gemsLife: 0, gemsRun: 0, ore: 0, volts: 0, voltsLife: 0, charge: 0, burst: 0, top: 0, tab: 0, u: {}, grid: Array(25).fill(null), tool: 'drill',
  muted: false, music: true, sci: false, ach: {}, st: { played: 0, ups: [0, 0, 0], bursts: 0, bestRate: 0, born: Date.now() }, sel: {}, cam: {}, hints: {}, last: Date.now(), name: '', deviceId: '' });
let S = Object.assign(fresh(), store.get(SAVE, {}));
const save = () => { S.last = Date.now(); store.set(SAVE, S); };
function fmt(n) { if (!isFinite(n)) return '∞'; if (n < 1000) return n < 10 ? (Math.round(n * 100) / 100).toString() : String(Math.floor(n)); if (S.sci) return n.toExponential(2).replace('+', ''); const e = Math.floor(Math.log10(n) / 3); if (e < SUF.length) { const v = n / Math.pow(1000, e); return (v >= 100 ? v.toFixed(0) : v.toFixed(v >= 10 ? 1 : 2)) + SUF[e]; } return n.toExponential(2).replace('+', ''); }
const fx = (m) => `×${fmt(m)}`;

// ---------- layers
const LAYERS = [
  { id: 'coin', name: 'Coins', icon: '🪙', c: '#ffc93c', what: 'Base pay + the coin web' },
  { id: 'gem', name: 'Gems', icon: '💎', c: '#3ef2ff', what: 'The gem web + the Mine' },
  { id: 'volt', name: 'Volts', icon: '⚡', c: '#b6ff3b', what: 'The volt web + the Capacitor' },
  { id: 'lab', name: '???', icon: '🧪', c: '#ff4fa3', what: 'coming soon' },
];
const COL = { coin: '#ffc93c', gem: '#3ef2ff', volt: '#b6ff3b', ore: '#9ad8ff', ach: '#ff9ad5' };

// ---------- the webs: grown from a centre in four directions, the same for every player (seeded)
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const DIRS = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
const WEBCFG = {
  coin: { seed: 11, base: 20, grow: 8, arms: { N: [8, 0.5, 3], E: [7, 0.5, 2], S: [7, 0.5, 2], W: [6, 0.5, 2] }, theme: { N: 'raw', E: 'eco', S: 'grow', W: 'link', B: 'raw' } },
  gem: { seed: 23, base: 10, grow: 3.2, arms: { N: [11, 0.6, 3], E: [9, 0.6, 3], S: [8, 0.6, 2], W: [9, 0.6, 3] }, theme: { N: 'mine', E: 'gain', S: 'mem', W: 'syn', B: 'gain' } },
  volt: { seed: 37, base: 5, grow: 2.2, arms: { N: [6, 0.5, 2], E: [5, 0.5, 2], S: [5, 0.5, 2], W: [5, 0.5, 2] }, theme: { N: 'burst', E: 'charge', S: 'keep', W: 'ore', B: 'charge' } },
};
// effect templates: t = what it does, a/b = strength, max = levels
function effectFor(L, theme, kind, d, i, main) {
  const alt = i % 2;
  if (L === 'coin') {
    if (theme === 'raw') return kind === 'key' ? { t: 'cm^', b: 10, max: 1 } : kind === 'notable' ? { t: 'cm^', b: 2, max: 3 } : { t: 'cm+', a: 0.2 + 0.04 * d, max: 5 };

  else if (S.tab === 1) { const v = voltGain(); up.disabled = v < 1; up.innerHTML = !has('mine') ? 'Layer up to ⚡ volts<small>open the Mine first (in the gem web)</small>' : v < 1 ? `Layer up to ⚡ volts<small>at ${fmt(1.2e5)} ore (${fmt(S.ore)})</small>` : `Layer up: +${fmt(v)} ⚡<small>resets gems, the gem web, the mine and coins</small>`; }
  else { up.disabled = true; up.innerHTML = 'Next layer: coming soon<small>🧪 the Lab is being built</small>'; }
  let bb = document.querySelector('.burst'); if (S.burst > 0) { if (!bb) { bb = document.createElement('div'); bb.className = 'burst'; document.body.appendChild(bb); } bb.textContent = `⚡ BURST ×${fmt(burstMult())} · ${Math.ceil(S.burst)} s`; } else if (bb) bb.remove();
  S.st.bestRate = Math.max(S.st.bestRate || 0, rate);
}
addEventListener('resize', () => applyCam());

// ---------- the ⚙️ sheet: stats, achievements, settings, save export/import, leaderboard
const LEADERBOARD_URL = 'https://rooftop-leaderboard.rooftop-b71afd.workers.dev', GAME_ID = 'layer';
const lbReachable = () => location.hostname === 'lennify44.github.io';
const score = () => Math.floor(S.top * 1000 + log10(S.life + 1) * 10 + achCount() * 5);
function deviceId() { if (!S.deviceId) { S.deviceId = (Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g, '').slice(0, 20); save(); } return S.deviceId; }
function openMenu() {
  const o = document.createElement('div'); o.className = 'over'; o.id = 'over';
  const tot = WEB.coin.length + WEB.gem.length + WEB.volt.length, own = owned('coin').length + owned('gem').length + owned('volt').length;
  const h = Math.floor(S.st.played / 3600), mi = Math.floor(S.st.played % 3600 / 60);
  o.innerHTML = `<div class="box"><div class="opt"><button type="button" id="mClose">✕ Close</button></div>
    <h2>📊 Stats</h2><dl class="stats">
      <div><dt>Time played</dt><dd>${h} h ${mi} min</dd></div><div><dt>Coins ever</dt><dd>${fmt(S.life)}</dd></div><div><dt>Best coins / s</dt><dd>${fmt(S.st.bestRate || 0)}</dd></div>
      <div><dt>Gems ever</dt><dd>${fmt(S.gemsLife)}</dd></div><div><dt>Volts ever</dt><dd>${fmt(S.voltsLife)}</dd></div><div><dt>Layer ups</dt><dd>💎 ${S.st.ups[1]} · ⚡ ${S.st.ups[2]}</dd></div>
      <div><dt>Nodes owned</dt><dd>${own}</dd></div><div><dt>Bursts</dt><dd>${S.st.bursts}</dd></div><div><dt>Score</dt><dd>${fmt(score())}</dd></div></dl>
    <h2>🏆 Achievements ${achCount()}/${ACH.length} <small style="font-size:14px">coins ×${fmt(achMult())}</small></h2><div class="achs">${ACH.map(([n, d]) => `<div class="ach${S.ach[n] ? ' on' : ''}"><b>${S.ach[n] ? '🏆' : '🔒'} ${n}</b><span>${d}</span></div>`).join('')}</div>
    <h2>⚙️ Settings</h2>
    <div class="opt"><span>Numbers</span><button type="button" data-o="suf" aria-pressed="${!S.sci}">1.5M</button><button type="button" data-o="sci" aria-pressed="${S.sci}">1.5e6</button></div>
    <div class="opt"><span>Music</span><button type="button" data-o="mus" aria-pressed="${S.music}">${S.music ? 'On' : 'Off'}</button></div>
    <h2>💾 Save</h2><p style="color:var(--haze);font-size:13px">Copy this text to keep your game safe or move it to another device; paste one in and tap Load.</p>
    <textarea id="mSave" spellcheck="false"></textarea><div class="opt"><button type="button" id="mLoad">Load</button><button type="button" id="mReset">Start over</button></div>
    <h2>🌍 World leaderboard</h2><div id="mLb" style="color:var(--haze);font-size:14px"></div>
    <div class="opt"><input type="text" id="mName" maxlength="16" placeholder="your name" autocomplete="nickname"><button type="button" id="mPost">Post my score</button></div><p id="mLbRes" style="color:var(--haze);font-size:13px"></p></div>`;
  document.body.appendChild(o);
  $('mSave').value = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  $('mName').value = S.name || '';
  $('mClose').addEventListener('click', () => o.remove());
  o.querySelectorAll('[data-o]').forEach((b) => b.addEventListener('click', () => { const k = b.getAttribute('data-o'); if (k === 'suf') S.sci = false; if (k === 'sci') S.sci = true; if (k === 'mus') { S.music = !S.music; Sound.init(); if (Sound.mus) Sound.mus.gain.value = S.music ? 0.5 : 0; } save(); o.remove(); openMenu(); render(true); }));
  $('mLoad').addEventListener('click', () => { try { const d = JSON.parse(decodeURIComponent(escape(atob($('mSave').value.trim())))); if (!d || typeof d !== 'object' || !('coins' in d)) throw new Error('bad'); S = Object.assign(fresh(), d); save(); o.remove(); toast('Save loaded', '', COL.coin); render(true); } catch (e) { toast('That save text does not work', 'copy the whole text again', COL.ach); } });
  $('mReset').addEventListener('click', (e) => { if (!e.currentTarget.dataset.sure) { e.currentTarget.dataset.sure = '1'; e.currentTarget.textContent = 'Tap again: really start over?'; return; } S = fresh(); save(); o.remove(); render(true); });
  $('mPost').addEventListener('click', postScore);
  showBoard();
}
async function showBoard() {
  const el = $('mLb'); if (!el) return;
  if (!lbReachable()) { el.textContent = 'The world leaderboard lives on the public version of the game (lennify44.github.io).'; return; }
  try { const r = await fetch(`${LEADERBOARD_URL}/scores?game=${GAME_ID}`); const d = await r.json(); const rows = (d.alltime || []).slice(0, 10); el.innerHTML = rows.length ? rows.map((x, i) => `${i + 1}. ${x.name.replace(/[<>&]/g, '')} · ${fmt(x.score)} · layer ${x.dist}`).join('<br>') : 'No scores yet. Be the first.'; } catch (e) { el.textContent = 'Could not reach the leaderboard right now.'; }
}
async function postScore() {
  const name = ($('mName').value || '').trim().replace(/[^\p{L}\p{N} _.\-]/gu, '').slice(0, 16), out = $('mLbRes');
  if (!name) { out.textContent = 'Type a name first.'; return; } if (!lbReachable()) { out.textContent = 'Posting works on the public version of the game.'; return; }
  S.name = name; save(); out.textContent = 'Posting…';
  try { const r = await fetch(`${LEADERBOARD_URL}/scores`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: deviceId(), name, game: GAME_ID, score: score(), dist: S.top + 1, daily: false }) }); const res = await r.json().catch(() => ({})); out.textContent = r.ok ? (res.rank && res.rank.alltime ? `World rank #${res.rank.alltime}` : 'Posted.') : 'The leaderboard did not take this score.'; showBoard(); } catch (e) { out.textContent = 'Could not reach the leaderboard right now.'; }
}
$('btnMenu').addEventListener('click', () => { Sound.init(); openMenu(); });

// ---------- loop, offline time, first-time hints
let last = performance.now(), saveT = 0, uiT = 0, achT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(1, (now - last) / 1000); last = now;
  step(dt); automate(dt);
  uiT += dt; if (uiT > 0.2) { uiT = 0; render(false); }
  achT += dt; if (achT > 1) { achT = 0; checkAch(); }
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }
}
(function offline() {
  const away = Math.min(8 * 3600, (Date.now() - (S.last || Date.now())) / 1000);
  if (away < 30) return;
  const before = S.coins, ore0 = S.ore, ch0 = S.charge, n = 400; for (let i = 0; i < n; i++) step(away / n);
  setTimeout(() => toast(`Welcome back: ${Math.round(away / 60)} min`, `+${fmt(S.coins - before)} coins${has('mine') ? ` · +${fmt(S.ore - ore0)} ore` : ''}${S.top >= 2 ? ` · capacitor ${Math.floor(ch0 * 100)} → ${Math.floor(S.charge * 100)} %` : ''}`), 500);
})();
if (!S.hints.first) { S.hints.first = 1; setTimeout(() => toast('Tap the glowing node', 'then Buy. Each node you buy reveals its neighbours.', COL.coin), 900); }
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
document.querySelectorAll('a[data-hub]').forEach((a) => { if (location.hostname === 'lennify44.github.io') a.removeAttribute('target'); });
$('btnMute').textContent = S.muted ? '🔇' : '🔊';
if (location.hash === '#bot') window.__game = { get S() { return S; }, step, automate, buy, layerUp, tileAt, discharge, gemGain, voltGain, WEB, NODE, coinRate, oreRate, visible, reachable, needOk, maxed, costAt, render, checkAch, ACH };
render(true);
requestAnimationFrame(frame);
})();
</script>
