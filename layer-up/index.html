<title>Layer Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  /* Layout: the layer map on top (one colour per layer), the active layer's upgrade tree below, the income breakdown
     under the big counter, Layer Up button pinned to the bottom */
  --night: #0f0b1e; --chalk: #fff7ee; --haze: #c4bce0;
  --coin: #ffc93c; --gem: #3ef2ff; --volt: #b6ff3b; --lab: #ff4fa3;
  --acc: var(--coin);
  --font-display: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  --font-body: "Barlow", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { background: var(--night); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--chalk); font-family: var(--font-body); font-size: 15px; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(ellipse at 50% -10%, color-mix(in srgb, var(--acc) 38%, #1a0f3a), var(--night) 62%); transition: background 0.6s; }
#app { max-width: 760px; margin: 0 auto; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 120px max(12px, env(safe-area-inset-left)); }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.big { font-family: var(--font-display); font-weight: 900; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--acc); text-shadow: 0 0 22px color-mix(in srgb, var(--acc) 50%, transparent); }
.big.bump { animation: bump 0.25s ease-out; }
@keyframes bump { 40% { transform: scale(1.12); } }
.rate { font-family: var(--font-mono); font-size: 13px; color: var(--chalk); margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { padding: 2px 7px; border-radius: 8px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: #120c22; background: var(--c); }
.icon-btn { width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.12); color: var(--chalk); font-size: 18px; cursor: pointer; }
.map { display: flex; gap: 6px; margin: 12px 0; overflow-x: auto; padding-bottom: 4px; }
.lay { flex: 1 0 100px; min-height: 66px; padding: 6px 8px; border-radius: 14px; border: 3px solid var(--c); background: color-mix(in srgb, var(--c) 18%, #140e28); color: var(--chalk); text-align: left; cursor: pointer; font-family: var(--font-body); }
.lay b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 19px; text-transform: uppercase; color: var(--c); }
.lay small { font-family: var(--font-mono); font-size: 11px; }
.lay[aria-pressed="true"] { background: var(--c); color: #120c22; box-shadow: 0 0 20px color-mix(in srgb, var(--c) 60%, transparent); }
.lay[aria-pressed="true"] b { color: #120c22; }
.lay.locked { opacity: 0.35; cursor: default; border-style: dashed; }
.card { padding: 12px; border-radius: 18px; background: color-mix(in srgb, var(--acc) 10%, #17112e); border: 2px solid color-mix(in srgb, var(--acc) 35%, transparent); margin-bottom: 10px; }
.card h2 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 900; font-size: 26px; text-transform: uppercase; color: var(--acc); }
.card p { margin: 0 0 8px; color: var(--haze); font-size: 13px; }
.tree { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 10px; padding: 6px 0; }
.tree svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node { position: relative; z-index: 1; min-height: 96px; padding: 7px 8px; border-radius: 14px; border: 2px solid var(--c); background: #140e28; color: var(--chalk); text-align: left; cursor: pointer; display: grid; align-content: start; gap: 2px; font-family: var(--font-body); }
.node b { font-family: var(--font-display); font-weight: 900; font-size: 16px; line-height: 1; text-transform: uppercase; color: var(--c); }
.node span { font-size: 12px; line-height: 1.25; color: var(--haze); }
.node em { font-style: normal; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--chalk); }
.node .cost { margin-top: 2px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--c); }
.node.can { box-shadow: 0 0 14px color-mix(in srgb, var(--c) 55%, transparent); animation: glow 1.2s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 24px color-mix(in srgb, var(--c) 75%, transparent); } }
.node.own { background: var(--c); color: #120c22; }
.node.own b, .node.own span, .node.own em, .node.own .cost { color: #120c22; }
.node.locked { opacity: 0.35; border-style: dashed; cursor: default; }
.node .x2 { position: absolute; top: 4px; right: 6px; font-size: 10px; padding: 0 4px; border-radius: 5px; background: var(--x); color: #120c22; font-family: var(--font-mono); font-weight: 600; font-style: normal; }
.node.got { animation: got 0.5s ease-out; }
@keyframes got { 30% { transform: scale(1.12) rotate(-2deg); } }
.grid { display: grid; gap: 6px; margin: 8px 0; }
.tile { aspect-ratio: 1; border-radius: 12px; border: 2px dashed color-mix(in srgb, var(--gem) 50%, transparent); background: rgba(0,0,0,0.25); color: var(--chalk); font-size: 26px; cursor: pointer; position: relative; display: grid; place-items: center; }
.tile.full { border-style: solid; border-color: var(--gem); background: color-mix(in srgb, var(--gem) 22%, transparent); }
.tile small { position: absolute; bottom: 2px; right: 5px; font-family: var(--font-mono); font-size: 10px; color: var(--gem); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tool { min-height: 44px; padding: 4px 10px; border-radius: 12px; border: 2px solid var(--gem); background: transparent; color: var(--chalk); font-family: var(--font-display); font-weight: 900; font-size: 15px; cursor: pointer; }
.tool[aria-pressed="true"] { background: var(--gem); color: #102030; }
.tool:disabled { opacity: 0.3; }
.cap { height: 36px; border-radius: 18px; border: 2px solid var(--volt); background: rgba(0,0,0,0.4); overflow: hidden; position: relative; margin: 8px 0; }
.cap i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #6aff3b, var(--volt), #fff); }
.cap span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 13px; color: #fff; text-shadow: 0 1px 3px #000; }
.brow { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid color-mix(in srgb, var(--acc) 25%, transparent); }
.brow .bi { font-size: 28px; text-align: center; }
.brow b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 18px; text-transform: uppercase; color: var(--acc); }
.brow span { font-family: var(--font-mono); font-size: 11px; color: var(--haze); }
.bbtn { min-width: 76px; min-height: 48px; padding: 2px 8px; border: 0; border-radius: 12px; background: var(--acc); color: #120c22; font-family: var(--font-display); font-weight: 900; font-size: 16px; cursor: pointer; }
.bbtn small { display: block; font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
.bbtn.max { min-width: 52px; background: transparent; color: var(--acc); border: 2px solid var(--acc); }
.bbtn:disabled { opacity: 0.35; cursor: default; }
.wide { width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: var(--acc); color: #120c22; font-family: var(--font-display); font-weight: 900; font-size: 22px; cursor: pointer; }
.wide:disabled { opacity: 0.35; cursor: default; }
.burst { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 6; padding: 6px 14px; border-radius: 999px; background: var(--volt); color: #1b2a00; font-family: var(--font-display); font-weight: 900; font-size: 18px; }
.upbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: linear-gradient(0deg, var(--night) 70%, transparent); display: flex; justify-content: center; }
.upbtn { width: 100%; max-width: 736px; min-height: 64px; border: 0; border-radius: 18px; background: linear-gradient(90deg, var(--acc), var(--nx, var(--lab))); color: #120c22; font-family: var(--font-display); font-weight: 900; font-size: 26px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 26px color-mix(in srgb, var(--nx, var(--lab)) 55%, transparent); }
.upbtn small { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; }
.upbtn:disabled { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); box-shadow: none; cursor: default; }
.toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 8; width: max-content; max-width: 90%; padding: 10px 18px; border-radius: 14px; background: rgba(15,11,30,0.94); border: 3px solid var(--acc); text-align: center; font-family: var(--font-display); font-weight: 900; font-size: 22px; text-transform: uppercase; animation: tin 0.25s ease-out; pointer-events: none; }
.toast small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 13px; text-transform: none; color: var(--haze); }
@keyframes tin { from { transform: translateX(-50%) scale(0.6); opacity: 0; } }
.flash { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; animation: fl 1.6s ease-out forwards; pointer-events: none; }
.flash b { font-family: var(--font-display); font-weight: 900; font-size: clamp(48px, 14vw, 110px); color: #120c22; text-transform: uppercase; animation: zoom 1.6s ease-out forwards; text-align: center; line-height: 0.9; }
@keyframes fl { 70% { opacity: 1; } to { opacity: 0; } }
@keyframes zoom { from { transform: scale(0.3); } 30% { transform: scale(1.1); } to { transform: scale(1.4); } }
.fly { position: fixed; z-index: 7; pointer-events: none; font-family: var(--font-display); font-weight: 900; font-size: 26px; text-shadow: 0 2px 0 rgba(0,0,0,0.6); transition: transform 0.7s cubic-bezier(.3,.7,.2,1), opacity 0.7s; }
.spark { position: fixed; z-index: 7; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; transition: transform 0.6s ease-out, opacity 0.6s; }
.foot { display: flex; justify-content: center; gap: 18px; margin-top: 12px; }
.link-btn { min-height: 44px; border: 0; background: none; color: var(--chalk); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
@media (max-width: 420px) { .tree { gap: 18px 6px; } .node { min-height: 92px; padding: 6px; } .node b { font-size: 14px; } .node span { font-size: 11px; } }
</style>

<body>
<!-- source:body -->
<div id="app">
  <div class="top">
    <div><div class="big" id="main">🪙 0</div><div class="rate" id="rate">0 / s</div></div>
    <button class="icon-btn" id="btnMute" type="button" aria-label="Sound on">🔊</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="map" id="map" aria-label="Layers"></div>
  <div id="screen"></div>
  <div class="foot"><a class="link-btn" data-hub href="https://lennify44.github.io/rooftop-roulette/arcade/" target="_blank" rel="noopener">All games</a></div>
</div>
<div class="upbar"><button class="upbtn" id="btnUp" type="button" disabled>Layer up</button></div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* blocked */ } } };
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) { if (!isFinite(n)) return '∞'; if (n < 1000) return n < 10 ? (Math.round(n * 100) / 100).toString() : String(Math.floor(n)); const e = Math.floor(Math.log10(n) / 3); if (e < SUF.length) { const v = n / Math.pow(1000, e); return (v >= 100 ? v.toFixed(0) : v.toFixed(v >= 10 ? 1 : 2)) + SUF[e]; } return n.toExponential(2).replace('+', ''); }
const fx = (m) => `×${fmt(m)}`;
const log10 = (n) => Math.log10(Math.max(1, n));

// ---------- layers: each has its colour, its currency, its upgrade tree and its own mechanic
const LAYERS = [
  { id: 'coin', name: 'Coins', icon: '🪙', c: '#ffc93c', what: 'Base pay + the coin tree' },
  { id: 'gem', name: 'Gems', icon: '💎', c: '#3ef2ff', what: 'The gem tree + the Mine' },
  { id: 'volt', name: 'Volts', icon: '⚡', c: '#b6ff3b', what: 'The volt tree + the Capacitor' },
  { id: 'lab', name: '???', icon: '🧪', c: '#ff4fa3', what: 'coming soon' },
];
const COL = { coin: '#ffc93c', gem: '#3ef2ff', volt: '#b6ff3b', ore: '#9ad8ff' };

// ---------- save
const SAVE = 'layer-up-save-v2';
const fresh = () => ({ coins: 0, run: 0, life: 0, runT: 0, cu: {}, bl: {}, gems: 0, gemsLife: 0, gemsRun: 0, gu: {}, grid: Array(25).fill(null), ore: 0, volts: 0, voltsLife: 0, vu: {}, charge: 0, burst: 0, top: 0, tab: 0, resets: [0, 0, 0], last: Date.now(), muted: false, tool: 'drill' });
let S = Object.assign(fresh(), store.get(SAVE, {}));
if (!S.bl) S.bl = {};
const save = () => { S.last = Date.now(); store.set(SAVE, S); };
const has = (id) => !!(S.cu[id] || S.gu[id] || S.vu[id]);
const count = (o) => Object.values(o).filter((v) => Number(v) > 0).length;
const levels = (o) => Object.values(o).reduce((a, v) => a + Number(v || 0), 0);

// ---------- the upgrade trees: one-time upgrades, mostly multipliers, many of them depend on other layers
// r/c place a node in its tree; req = nodes that must be owned first; x = the other layer this node is tied to
const TREE = {
  coin: [
    { id: 'c1', r: 0, c: 1, name: 'Piggy bank', cost: 30, cg: 12, max: 5, req: [], d: 'Coins ×2 per level', m: (l) => Math.pow(2, l) },
    { id: 'c2', r: 1, c: 0, name: 'Side hustle', cost: 120, cg: 3, max: 10, req: ['c1'], d: 'Base pay +2 per level', base: (l) => 2 * l },
    { id: 'c3', r: 1, c: 2, name: 'Compound', cost: 240, cg: 12, max: 5, req: ['c1'], d: '+5 % per level for every coin upgrade level you own', m: (l) => 1 + 0.05 * l * levels(S.cu) },
    { id: 'c4', r: 2, c: 0, name: 'Interest', cost: 1050, cg: 15, max: 4, req: ['c2'], d: 'Grows with the coins you hold', m: (l) => 1 + l * log10(S.coins + 1) / 4 },
    { id: 'c5', r: 2, c: 1, name: 'Lucky penny', cost: 2700, cg: 40, max: 3, req: ['c2', 'c3'], d: 'Coins ×3 per level', m: (l) => Math.pow(3, l) },
    { id: 'c6', r: 2, c: 2, name: 'Momentum', cost: 1800, cg: 15, max: 4, req: ['c3'], d: 'Grows with the time of this run', m: (l) => 1 + l * Math.sqrt(S.runT / 60) / 2 },
    { id: 'c7', r: 3, c: 0, name: 'Snowball', cost: 18000, cg: 20, max: 4, req: ['c4'], d: 'More interest per level', m: (l) => 1 + l * log10(S.coins + 1) / 4 },
    { id: 'c8', r: 3, c: 1, name: 'Gem sense', cost: 60000, cg: 20, max: 5, req: ['c5'], d: 'Gems from a layer up ×(1 + level)', x: 'gem', gm: (l) => 1 + l },
    { id: 'c9', r: 3, c: 2, name: 'Tycoon', cost: 36000, cg: 20, max: 3, req: ['c6'], d: 'Base pay + level × coin upgrades owned', base: (l) => l * count(S.cu) },
    { id: 'c10', r: 4, c: 0, name: 'Ore lust', cost: 6e+08, cg: 30, max: 3, req: ['c7'], d: 'Ore grows with your coin upgrade levels', x: 'gem', om: (l) => 1 + l * levels(S.cu) / 16, need: 1 },
    { id: 'c11', r: 4, c: 1, name: 'Golden touch', cost: 3e+08, cg: 200, max: 3, req: ['c8'], d: 'Coins ×3 per level', m: (l) => Math.pow(3, l) },
    { id: 'c12', r: 4, c: 2, name: 'Gem synergy', cost: 9e+08, cg: 50, max: 3, req: ['c9'], d: 'Coins grow with the gem upgrades you own', x: 'gem', m: (l) => 1 + l * count(S.gu) / 2, need: 1 },
    { id: 'c13', r: 5, c: 0, name: 'Vault', cost: 3e+10, cg: 50, max: 3, req: ['c10'], d: 'Grows with every coin you ever earned', m: (l) => 1 + l * log10(S.life + 1) / 2, need: 1 },
    { id: 'c14', r: 5, c: 1, name: 'Overtime', cost: 3e+11, cg: 20, max: 4, req: ['c11'], d: 'The capacitor charges +50 % per level', x: 'volt', cm: (l) => 1 + 0.5 * l, need: 2 },
    { id: 'c15', r: 5, c: 2, name: 'Coin storm', cost: 1.5e+12, cg: 10000, max: 2, req: ['c12'], d: 'Coins ×5 per level', m: (l) => Math.pow(5, l), need: 1 },
    { id: 'c16', r: 6, c: 0, name: 'Machine love', cost: 3e+12, cg: 30, max: 3, req: ['c13'], d: 'Coins grow with your endless upgrade levels', m: (l) => 1 + l * levels(S.bl) / 20, need: 1 },
    { id: 'c17', r: 6, c: 1, name: 'Patience', cost: 9e+12, cg: 30, max: 3, req: ['c14'], d: 'Grows with the time since your last layer up', m: (l) => 1 + l * log10(S.runT + 1), need: 2 },
    { id: 'c18', r: 6, c: 2, name: 'Gem magnet', cost: 3e+13, cg: 40, max: 3, req: ['c15'], d: 'Gems from a layer up ×(1 + level / 2)', x: 'gem', gm: (l) => 1 + l / 2, need: 1 },
  ],
  gem: [
    { id: 'g1', r: 0, c: 1, name: 'Gem glow', cost: 10, cg: 8, max: 4, req: [], d: 'Coins grow with every gem you ever earned', x: 'coin', m: (l) => Math.pow(S.gemsLife + 1, 0.15 * l) },
    { id: 'g2', r: 1, c: 0, name: 'Coin memory', cost: 20, cg: 10, max: 3, req: ['g1'], d: 'Each level keeps one more row of the coin tree on a layer up', x: 'coin' },
    { id: 'g3', r: 1, c: 1, name: 'The Mine', cost: 50, max: 1, req: ['g1'], d: 'Opens a 3×3 mine: drills dig ore, ore multiplies coins' },
    { id: 'g4', r: 1, c: 2, name: 'Polish', cost: 50, cg: 30, max: 4, req: ['g1'], d: 'Coins ×2 per level', x: 'coin', m: (l) => Math.pow(2, l) },
    { id: 'g5', r: 2, c: 0, name: 'Full memory', cost: 3000, max: 1, req: ['g2'], d: 'Keep every coin upgrade on a layer up', x: 'coin' },
    { id: 'g6', r: 2, c: 1, name: 'Amplifiers', cost: 200, cg: 15, max: 3, req: ['g3'], d: 'Amplifier tiles: + level power to the drills next to them' },
    { id: 'g7', r: 2, c: 2, name: 'Prism', cost: 400, cg: 15, max: 4, req: ['g4'], d: 'Gems from a layer up grow with your coin upgrade levels', gm: (l) => 1 + l * levels(S.cu) / 20 },
    { id: 'g8', r: 3, c: 0, name: 'Wider mine', cost: 30000, max: 1, req: ['g5', 'g6'], d: 'The mine grows to 4×4' },
    { id: 'g9', r: 3, c: 1, name: 'Crystals', cost: 100000, cg: 20, max: 3, req: ['g6'], d: 'Crystal tiles: ×(1 + level) to every drill in their row and column' },
    { id: 'g10', r: 3, c: 2, name: 'Facets', cost: 60000, cg: 20, max: 3, req: ['g7'], d: 'Ore grows with the gem upgrades you own', om: (l) => 1 + l * count(S.gu) / 3 },
    { id: 'g11', r: 4, c: 0, name: 'Deep mine', cost: 2e+06, max: 1, req: ['g8'], d: 'The mine grows to 5×5' },
    { id: 'g12', r: 4, c: 1, name: 'Gem storm', cost: 5e+06, cg: 30, max: 3, req: ['g9'], d: 'Gems from a layer up grow with your volts ever', x: 'volt', gm: (l) => 1 + l * S.voltsLife / 10, need: 2 },
    { id: 'g13', r: 4, c: 2, name: 'Mother lode', cost: 1e+06, cg: 30, max: 3, req: ['g10'], d: 'Coins ×(1 + log of ore) per level', x: 'coin', m: (l) => Math.pow(1 + log10(S.ore + 1), l) },
    { id: 'g14', r: 5, c: 0, name: 'Pressure', cost: 3e6, cg: 20, max: 3, req: ['g11'], d: 'Coins grow with your gem press levels', x: 'coin', m: (l) => 1 + l * Number(S.bl.b3 || 0) / 10 },
    { id: 'g15', r: 5, c: 2, name: 'Geode', cost: 5e6, cg: 30, max: 3, req: ['g13'], d: 'Gems from a layer up ×2 per level', gm: (l) => Math.pow(2, l) },
  ],
  volt: [

// ---------- the numbers: every multiplier is listed, so the breakdown can show where income comes from
function coinParts() {

// softcaps: past these marks every extra multiplier counts less (keeps the numbers in reach of the upgrade prices)
const soft = (v, at, k) => (v <= at ? v : at * Math.pow(v / at, k));

const prod = (key) => ALL.reduce((a, u) => (u[key] && owned(u) ? a * u[key](lv(u)) : a), 1);

}

  const parts = coinParts(), raw = parts.reduce((a, p) => a * p.v, 1), rate = coinSoft(raw);
  if (rate < raw * 0.999) parts.push({ t: 'softcap', v: rate / raw, c: '#9a92b8' });
  $('rate').textContent = L === 'coin' ? `${fmt(rate)} coins / s` : L === 'gem' ? `ore ${fmt(S.ore)} (+${fmt(oreRate())}/s) · ${fmt(rate)} coins/s` : `charge ${Math.floor(S.charge * 100)} % · ${fmt(rate)} coins/s`;
  // income breakdown: every multiplier as a chip in its layer's colour
  const html = parts.filter((p) => p.plus || p.v > 1.005 || p.t === 'softcap').map((p) => `<span class="chip" style="--c:${p.c}">${p.plus ? `base ${fmt(p.v)}` : p.t === 'softcap' ? `softcap ÷${fmt(1 / p.v)}` : `${p.t} ×${fmt(p.v)}`}</span>`).join('');
  if ($('chips').innerHTML !== html) $('chips').innerHTML = html;
  document.querySelectorAll('[data-up]').forEach((b) => {
    const u = ALL.find((x) => x.id === b.getAttribute('data-up')), l = lv(u), mx = u.max || 1, full = l >= mx, ok = reqOk(u), can = !full && ok && S[wallet(u.L)] >= costAt(u);
    const cls = 'node' + (full ? ' own' : !ok ? ' locked' : can ? ' can' : '') + (b.classList.contains('got') ? ' got' : '');
    if (b.className !== cls) b.className = cls;
    const f = u.m || u.gm || u.om || u.cm || u.vm, lvTxt = mx > 1 ? `Lv ${l}/${mx} · ` : '';
    b.querySelector('[data-k=now]').textContent = f ? `${lvTxt}${fx(f(l))}${full ? '' : ` → ${fx(f(l + 1))}`}` : u.base ? `${lvTxt}+${fmt(u.base(l))}${full ? '' : ` → +${fmt(u.base(l + 1))}`} base` : (mx > 1 ? `Lv ${l}/${mx}` : '');
    b.querySelector('.cost').textContent = full ? (mx > 1 ? 'MAX' : 'owned') : !ok ? (u.need && S.top < u.need ? `needs ${LAYERS[u.need].name}` : 'locked') : `${fmt(costAt(u))} ${LAYERS.find((z) => z.id === u.L).icon}`;
  });
  document.querySelectorAll('[data-buy]').forEach((r) => {
    const u = ALL.find((x) => x.id === r.getAttribute('data-buy')), l = lv(u), f = u.m || u.gm || u.om || u.vm, c = costAt(u), ok = S[wallet(u.L)] >= c;
    r.querySelector('[data-k=e]').textContent = `Lv ${l} · ${f ? `${fx(f(l))} → ${fx(f(l + 1))}` : `+${fmt(u.base(l))} → +${fmt(u.base(l + 1))} base`} · ${u.d}`;
    const one = r.querySelector('[data-k=one]'); one.innerHTML = `Buy<small>${fmt(c)} ${LAYERS.find((z) => z.id === u.L).icon}</small>`; one.disabled = !ok; r.querySelector('[data-k=max]').disabled = !ok;
  });
  if (L === 'volt') { const f = document.querySelector('[data-k=cf]'); if (f) { f.style.width = `${S.charge * 100}%`; document.querySelector('[data-k=ct]').textContent = S.burst > 0 ? `BURST · ${Math.ceil(S.burst)} s` : `${Math.floor(S.charge * 100)} % · full in ${fmt(Math.max(0, (1 - S.charge) / chargeRate()))} s`; document.querySelector('[data-k=dis]').disabled = S.charge < 0.05 || S.burst > 0; } }
  document.querySelectorAll('[data-v]').forEach((e) => { const i = +e.getAttribute('data-v'); e.textContent = i === 0 ? fmt(S.coins) : i === 1 ? fmt(S.gems) : fmt(S.volts); });
  const up = $('btnUp'); up.style.setProperty('--nx', LAYERS[Math.min(3, S.tab + 1)].c);
  if (S.tab === 0) { const g = gemGain(); up.disabled = g < 1; up.innerHTML = g < 1 ? `Layer up to 💎 gems<small>at ${fmt(1e6)} coins this run (${fmt(S.run)})</small>` : `Layer up: +${fmt(g)} 💎<small>resets coins and coin upgrades${S.gu.g5 ? ' (kept: all)' : S.gu.g2 ? ` (kept: ${S.gu.g2} row${S.gu.g2 > 1 ? 's' : ''})` : ''}</small>`; }
  else if (S.tab === 1) { const v = voltGain(); up.disabled = v < 1; up.innerHTML = !S.gu.g3 ? 'Layer up to ⚡ volts<small>open the Mine first (gem tree)</small>' : v < 1 ? `Layer up to ⚡ volts<small>at ${fmt(3e4)} ore (${fmt(S.ore)})</small>` : `Layer up: +${fmt(v)} ⚡<small>resets gems, the mine and coins</small>`; }
  else { up.disabled = true; up.innerHTML = 'Next layer: coming soon<small>🧪 the Lab is being built</small>'; }
  let bb = document.querySelector('.burst'); if (S.burst > 0) { if (!bb) { bb = document.createElement('div'); bb.className = 'burst'; document.body.appendChild(bb); } bb.textContent = `⚡ BURST ×${burstMult()} · ${Math.ceil(S.burst)} s`; } else if (bb) bb.remove();
}
addEventListener('resize', () => { const t = document.querySelector('.tree'); if (t) drawLines(t, LAYERS[S.tab].id); });

// ---------- loop, offline time
let last = performance.now(), saveT = 0, uiT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(1, (now - last) / 1000); last = now;
  step(dt); automate(dt);
  uiT += dt; if (uiT > 0.2) { uiT = 0; render(false); }
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }
}
(function offline() {
  const away = Math.min(8 * 3600, (Date.now() - (S.last || Date.now())) / 1000);
  if (away < 30) return;
  const before = S.coins, ore0 = S.ore, n = 400; for (let i = 0; i < n; i++) step(away / n);
  setTimeout(() => toast(`Welcome back: ${Math.round(away / 60)} min`, `+${fmt(S.coins - before)} coins${S.gu.g3 ? ` · +${fmt(S.ore - ore0)} ore` : ''}${S.top >= 2 ? ` · capacitor ${Math.floor(S.charge * 100)} %` : ''}`), 400);
})();
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
document.querySelectorAll('a[data-hub]').forEach((a) => { if (location.hostname === 'lennify44.github.io') a.removeAttribute('target'); });
$('btnMute').textContent = S.muted ? '🔇' : '🔊';
if (location.hash === '#bot') window.__game = { get S() { return S; }, step, automate, buy, layerUp, tileAt, discharge, gemGain, voltGain, ALL, TREE, BUY, coinRate, oreRate, reqOk, owned, maxed, costAt, render };
render(true);
requestAnimationFrame(frame);
})();
</script>
