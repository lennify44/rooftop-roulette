<!doctype html>
<html lang="en">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>

<!-- source:head -->
<title>Layer Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  /* Layout: one fixed screen, the page never scrolls. HUD on top, the active layer's upgrade web in the middle (a pannable 2D plane
     with fog; minimap and the node sheet lie over it), a dock with that layer's panels (only its inside scrolls; tap the open panel's
     tab to fold it), the Layer Up bar and the layer tabs at the bottom. Landscape: tabs left, dock right. ⚙️ opens stats/settings */
  --night: #0f0b1e; --chalk: #fff7ee; --haze: #c4bce0;
  --coin: #ffc93c; --gem: #3ef2ff; --volt: #b6ff3b; --lab: #ff4fa3;
  --acc: var(--coin);
  --font-display: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  --font-body: "Barlow", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { background: var(--night); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; overflow: hidden; overscroll-behavior: none; color: var(--chalk); font-family: var(--font-body); font-size: 15px; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(ellipse at 50% -10%, color-mix(in srgb, var(--acc) 38%, #1a0f3a), var(--night) 62%); transition: background 0.6s; }
#app { --dock: clamp(176px, 31vh, 300px); position: fixed; inset: 0; display: grid; gap: 6px; padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  grid-template: "hud" auto "stage" minmax(0, 1fr) "dock" var(--dock) "up" auto "map" auto / minmax(0, 1fr); }
.hud { grid-area: hud; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; align-items: center; }
.hud-main { min-width: 0; }
.big { font-family: var(--font-display); font-weight: 900; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--acc); text-shadow: 0 0 22px color-mix(in srgb, var(--acc) 50%, transparent); white-space: nowrap; }
.big.bump { animation: bump 0.25s ease-out; }
@keyframes bump { 40% { transform: scale(1.12); } }
.rate, .goal { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goal { font-size: 11px; color: var(--haze); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.hud .chips { grid-column: 1 / -1; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0; } .hud .chip { flex: none; }
.hud .chips::-webkit-scrollbar, .dtabs::-webkit-scrollbar { display: none; }
.chip { padding: 2px 7px; border-radius: 8px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: #120c22; background: var(--c); }
.tbtns { display: flex; gap: 6px; }
.spd { min-height: 40px; padding: 0 12px; border-radius: 20px; border: 2px solid var(--acc); background: rgba(15,11,30,0.85); color: var(--acc); font-family: var(--font-display); font-weight: 900; font-size: 17px; cursor: pointer; align-self: center; }
.spd[hidden] { display: none; }
.icon-btn { width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.12); color: var(--chalk); font-size: 18px; cursor: pointer; }
.map { grid-area: map; display: flex; gap: 4px; min-width: 0; }
.lay { position: relative; flex: 1 1 0; min-width: 0; min-height: 56px; padding: 3px 2px 7px; border-radius: 12px; border: 2px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 14%, #140e28); color: var(--chalk); cursor: pointer; font-family: var(--font-body); display: grid; justify-items: center; align-content: center; overflow: hidden; }
.lay i { font-style: normal; font-size: 20px; line-height: 1.15; }
.lay b { max-width: 100%; font-family: var(--font-display); font-weight: 900; font-size: 12px; line-height: 1.1; text-transform: uppercase; color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay small { max-width: 100%; font-family: var(--font-mono); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay .v2 { display: none; opacity: 0.75; }
.pg { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,0.4); }
.pg span { display: block; height: 100%; width: 0; background: var(--c); }
.lay em, .dtab em { font-style: normal; font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 0 5px; border-radius: 8px; background: #ff4f6d; color: #fff; }
.lay em { position: absolute; top: 2px; right: 3px; } .dtab em { margin-left: 5px; } .lay em:empty, .dtab em:empty { display: none; }
.lay[aria-pressed="true"] { background: var(--c); color: #120c22; border-color: var(--c); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 60%, transparent); }
.lay[aria-pressed="true"] b { color: #120c22; } .lay[aria-pressed="true"] .pg span { background: #120c22; }
.lay.locked { flex-grow: 0.55; opacity: 0.4; cursor: default; border-style: dashed; }
.stage { grid-area: stage; position: relative; min-height: 0; border-radius: 14px; overflow: hidden; border: 2px solid color-mix(in srgb, var(--acc) 35%, transparent); }
.dock { grid-area: dock; min-height: 0; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; background: color-mix(in srgb, var(--acc) 10%, #17112e); border: 2px solid color-mix(in srgb, var(--acc) 35%, transparent); }
.dtabs { flex: none; display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,0.32); overflow-x: auto; scrollbar-width: none; }
.dtab { flex: 1 0 auto; min-height: 40px; padding: 2px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--haze); font-family: var(--font-display); font-weight: 900; font-size: 16px; text-transform: uppercase; white-space: nowrap; cursor: pointer; }
.dtab[aria-pressed="true"] { background: var(--acc); color: #120c22; }
.dbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 10px; }
.pane { display: flex; flex-direction: column; }
.pane h2 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 900; font-size: 20px; text-transform: uppercase; color: var(--acc); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pane h2 small { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--chalk); text-transform: none; }
.pane p { margin: 0 0 8px; color: var(--haze); font-size: 12px; }
.pane > p:first-of-type { order: 9; margin: 8px 0 0; }
.pane[data-pane="mine"] { display: grid; grid-template-columns: min(54%, 250px) minmax(0, 1fr); gap: 6px 10px; align-content: start; }
.pane[data-pane="mine"] > h2, .pane[data-pane="mine"] > p { grid-column: 1 / -1; }
.pane[data-pane="mine"] .grid { grid-area: 2 / 1 / span 2; margin: 0; align-self: start; }
.pane[data-pane="mine"] .tile { min-width: 0; font-size: 18px; border-radius: 9px; } .pane[data-pane="mine"] .tile small { font-size: 9px; bottom: 1px; right: 3px; }
.dtabs.many .dtab:not([aria-pressed="true"]) span { display: none; }
.pane[data-pane="mine"] .tools { flex-direction: column; } .pane[data-pane="mine"] .tool { text-align: left; }
.ladder { display: grid; gap: 4px; margin-top: 8px; }
.rk { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0 8px; align-items: center; padding: 4px 8px; border-radius: 10px; border: 2px dashed rgba(255,255,255,0.15); }
.rk i { grid-row: 1 / span 2; font-style: normal; font-size: 22px; }
.rk b { font-family: var(--font-display); font-weight: 900; font-size: 16px; text-transform: uppercase; }
.rk span { grid-area: 2 / 2; font-size: 12px; color: var(--haze); }
.rk em { grid-area: 1 / 3 / span 2; font-style: normal; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--coin); text-align: right; }
.rk.on { border-style: solid; border-color: var(--coin); background: color-mix(in srgb, var(--coin) 14%, transparent); }
.rk.now { border-color: var(--coin); box-shadow: 0 0 12px color-mix(in srgb, var(--coin) 55%, transparent); }
.nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; }
.nums h3 { grid-column: 1 / -1; margin: 4px 0 0; font-family: var(--font-display); font-weight: 900; font-size: 15px; text-transform: uppercase; color: var(--acc); }
.nums div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 3px 8px; border-radius: 8px; background: rgba(255,255,255,0.06); border-left: 4px solid var(--c, var(--acc)); }
.nums span { font-size: 12px; color: var(--haze); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nums b { font-family: var(--font-mono); font-size: 12px; font-weight: 600; white-space: nowrap; }
/* the web */
.view { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; background:
  radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--acc) 12%, transparent), transparent 70%), repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 48px), repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 48px), #0c0818; }
.plane { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.plane svg { position: absolute; left: -4000px; top: -4000px; width: 8000px; height: 8000px; pointer-events: none; overflow: visible; }
.nd { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 16px; border: 3px solid var(--c); background: #140e28; color: var(--chalk); display: grid; place-items: center; align-content: center; gap: 0; font-family: var(--font-display); font-weight: 900; cursor: pointer; padding: 0; }
.nd i { font-style: normal; font-size: 24px; line-height: 1; }
.nd small { font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
.nd.notable { width: 82px; height: 82px; margin: -41px 0 0 -41px; border-radius: 50%; border-width: 4px; }
.nd.key { width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 22px; border-width: 5px; transform: rotate(45deg); }
.nd.key > * { transform: rotate(-45deg); }
.nd.inf { border-style: double; border-width: 6px; }
.nd.core { width: 88px; height: 88px; margin: -44px 0 0 -44px; border-radius: 50%; border-width: 5px; }
.nd.own { background: color-mix(in srgb, var(--c) 45%, #140e28); }
.nd.full { background: var(--c); color: #120c22; }
.nd.can { box-shadow: 0 0 16px var(--c); animation: glow 1.1s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 30px var(--c); } }
.rift { position: relative; height: 150px; display: grid; place-items: center; margin: 2px 0 8px; overflow: hidden; border-radius: 12px; background: radial-gradient(circle, rgba(255,138,61,0.12), transparent 70%); }
.rift > * { grid-area: 1 / 1; }
.rift .disk { width: calc(var(--hs, 56px) * 2.3); height: calc(var(--hs, 56px) * 0.8); border-radius: 50%; background: conic-gradient(from 0deg, #ff8a3d, #ffd36b, #ff4f3d, #7a2cff, #ff8a3d); filter: blur(3px); opacity: 0.8; animation: dspin 4s linear infinite; }
.rift .hole { width: var(--hs, 56px); height: var(--hs, 56px); border-radius: 50%; background: radial-gradient(circle, #000 62%, #2a1200 74%, transparent 76%); box-shadow: 0 0 0 3px #ff8a3d, 0 0 26px 8px rgba(255,138,61,0.5); transition: width 0.4s, height 0.4s; z-index: 1; }
.rift .ring { width: var(--hs, 56px); height: var(--hs, 56px); border-radius: 50%; border: 3px solid #ff8a3d; opacity: 0; z-index: 2; pointer-events: none; }
.rift.pulse .ring { animation: pring 1s ease-out infinite; } .rift.pulse .r2 { animation-delay: 0.5s; }
.rift.pulse .hole { box-shadow: 0 0 0 4px #ffd36b, 0 0 44px 16px rgba(255,138,61,0.85); }
.rift i { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2px; border-radius: 50%; background: #ffd36b; opacity: 0; animation: mote 2.4s linear infinite; z-index: 1; }
@keyframes dspin { to { transform: rotate(360deg); } }
@keyframes pring { from { transform: scale(1); opacity: 0.9; } to { transform: scale(2.6); opacity: 0; } }
@keyframes mote { from { transform: rotate(var(--a)) translateX(120px); opacity: 0; } 20% { opacity: 1; } to { transform: rotate(calc(var(--a) + 200deg)) translateX(8px); opacity: 0; } }
.pbar { position: relative; height: 26px; border-radius: 13px; background: rgba(0,0,0,0.45); border: 2px solid color-mix(in srgb, #ff8a3d 60%, transparent); overflow: hidden; margin-bottom: 8px; }
.pbar b { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #7a2cff, #ff8a3d); transition: width 0.2s linear; }
.pbar span { position: relative; display: block; text-align: center; line-height: 22px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
.pbar.on { border-color: #ffd36b; box-shadow: 0 0 16px rgba(255,211,107,0.7); } .pbar.on b { background: linear-gradient(90deg, #ff8a3d, #ffd36b); }
.feeds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.pane[data-pane="rift"] { display: grid; grid-template-columns: minmax(0, 44%) minmax(0, 1fr); gap: 6px 10px; align-content: start; }
.pane[data-pane="rift"] > h2 { grid-column: 1 / -1; grid-row: 1; } .pane[data-pane="rift"] > .nums { grid-column: 1 / -1; grid-row: 4; } .pane[data-pane="rift"] > p { grid-column: 1 / -1; grid-row: 5; }
.pane[data-pane="rift"] .rift { grid-column: 1; grid-row: 2 / span 2; height: 136px; margin: 0; }
.pane[data-pane="rift"] .pbar { grid-column: 2; grid-row: 2; margin: 0; } .pane[data-pane="rift"] .feeds { grid-column: 2; grid-row: 3; grid-template-columns: 1fr; margin: 0; }
.feeds .wide { font-size: 19px; } .feeds .wide.beat { animation: beat 0.45s ease-in-out infinite alternate; box-shadow: 0 0 18px #ffd36b; }
@keyframes beat { to { transform: scale(1.05); } }
.nd.fog { border-style: dashed; opacity: 0.45; background: #0c0818; }
.nd.sel { outline: 3px solid #fff; outline-offset: 4px; }
.nd.got { animation: got 0.5s ease-out; }
@keyframes got { 30% { scale: 1.2; } }
.vbtns { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; z-index: 2; }
.vbtns button { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--acc); background: rgba(15,11,30,0.85); color: var(--chalk); font-size: 20px; font-weight: 700; cursor: pointer; }
.mini { position: absolute; left: 8px; top: 40px; width: 64px; height: 64px; border-radius: 10px; border: 2px solid color-mix(in srgb, var(--acc) 60%, transparent); background: rgba(15,11,30,0.85); z-index: 2; pointer-events: none; }
.disc { position: absolute; left: 8px; top: 8px; z-index: 2; padding: 3px 8px; border-radius: 8px; background: rgba(15,11,30,0.85); font-family: var(--font-mono); font-size: 12px; pointer-events: none; }
.sheet { position: absolute; left: 6px; right: 6px; bottom: 6px; z-index: 3; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; padding: 6px 8px; border-radius: 12px; background: rgba(15,11,30,0.93); border: 2px solid var(--c, var(--acc)); }
.sheet b { font-family: var(--font-display); font-weight: 900; font-size: 18px; text-transform: uppercase; color: var(--c, var(--acc)); }
.sheet .kd { font-family: var(--font-mono); font-size: 11px; color: var(--haze); margin-left: 6px; }
.sheet .ds { font-size: 12px; color: var(--haze); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sheet .nw { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.sheet .btns { display: flex; gap: 6px; }
.bbtn { min-width: 76px; min-height: 48px; padding: 2px 10px; border: 0; border-radius: 12px; background: var(--c, var(--acc)); color: #120c22; font-family: var(--font-display); font-weight: 900; font-size: 18px; cursor: pointer; }
.bbtn small { display: block; font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
.bbtn.max { min-width: 56px; background: transparent; color: var(--c, var(--acc)); border: 2px solid var(--c, var(--acc)); }
.bbtn:disabled { opacity: 0.35; cursor: default; }
/* mine + capacitor */
.grid { display: grid; gap: 6px; margin: 8px 0; }
.tile { aspect-ratio: 1; border-radius: 12px; border: 2px dashed color-mix(in srgb, var(--gem) 50%, transparent); background: rgba(0,0,0,0.25); color: var(--chalk); font-size: 26px; cursor: pointer; position: relative; display: grid; place-items: center; }
.tile.full { border-style: solid; border-color: var(--gem); background: color-mix(in srgb, var(--gem) 22%, transparent); }
.tile small { position: absolute; bottom: 2px; right: 5px; font-family: var(--font-mono); font-size: 10px; color: var(--gem); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tool { min-height: 44px; padding: 4px 10px; border-radius: 12px; border: 2px solid var(--gem); background: transparent; color: var(--chalk); font-family: var(--font-display); font-weight: 900; font-size: 15px; cursor: pointer; }
.tool[aria-pressed="true"] { background: var(--gem); color: #102030; }
.tool:disabled { opacity: 0.3; }
.cap { height: 36px; border-radius: 18px; border: 2px solid var(--volt); background: rgba(0,0,0,0.4); overflow: hidden; position: relative; margin: 8px 0; }
.cap i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #6aff3b, var(--volt), #fff); }
.cap span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 13px; color: #fff; text-shadow: 0 1px 3px #000; }
.opt .wide { flex: 1; background: var(--acc); color: #120c22; justify-content: center; }
.opt .wide:disabled { opacity: 0.35; }
.ship { padding: 8px 0; border-top: 1px solid rgba(169,139,255,0.3); }
.ship b { font-family: var(--font-display); font-weight: 900; font-size: 18px; text-transform: uppercase; }
.dests { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; margin-top: 6px; }
.dests button { min-height: 52px; padding: 4px 8px; border-radius: 12px; border: 2px solid var(--star, #a98bff); background: rgba(169,139,255,0.1); color: var(--chalk); font-family: var(--font-display); font-weight: 900; font-size: 15px; cursor: pointer; text-align: left; }
.dests button small { display: block; font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--haze); }
.ship .cap { border-color: #a98bff; } .ship .cap i { background: linear-gradient(90deg, #6a4aff, #a98bff, #fff); }
.rx-slots { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 6px 0; font-family: var(--font-display); font-weight: 900; font-size: 24px; text-transform: uppercase; }
.rx-slots span { min-width: 120px; padding: 10px; border-radius: 14px; border: 3px dashed var(--lab); text-align: center; }
.rx-pal { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.rx-pal button { min-height: 44px; padding: 4px 10px; border-radius: 12px; border: 2px solid var(--lab); background: rgba(255,79,163,0.1); color: var(--chalk); font-family: var(--font-display); font-weight: 900; font-size: 16px; cursor: pointer; }
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin-top: 8px; }
.bk { padding: 6px 8px; border-radius: 10px; border: 2px dashed rgba(255,255,255,0.15); }
.bk b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 15px; text-transform: uppercase; }
.bk span { font-size: 12px; color: var(--haze); }
.bk.on { border-style: solid; border-color: var(--lab); background: rgba(255,79,163,0.12); }
.wide { width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: var(--acc); color: #120c22; font-family: var(--font-display); font-weight: 900; font-size: 22px; cursor: pointer; }
.wide:disabled { opacity: 0.35; cursor: default; }
.wide small { display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 600; }

  const name = ($('mName').value || '').trim().replace(/[^\p{L}\p{N} _.\-]/gu, '').slice(0, 16), out = $('mLbRes');
  if (!name) { out.textContent = 'Type a name first.'; return; } if (S.devUsed) { out.textContent = 'This save ran with dev speed, so it cannot post to the world leaderboard. Start over for a fair run.'; return; } if (!lbReachable()) { out.textContent = 'Posting works on the public version of the game.'; return; }
  S.name = name; save(); out.textContent = 'Posting…';
  try { const r = await fetch(`${LEADERBOARD_URL}/scores`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: deviceId(), name, game: GAME_ID, score: score(), dist: S.top + 1, daily: false }) }); const res = await r.json().catch(() => ({})); out.textContent = r.ok ? (res.rank && res.rank.alltime ? `World rank #${res.rank.alltime}` : 'Posted.') : 'The leaderboard did not take this score.'; showBoard(); } catch (e) { out.textContent = 'Could not reach the leaderboard right now.'; }
}
$('btnMenu').addEventListener('click', () => { Sound.init(); openMenu(); });

// ---------- loop, offline time, first-time hints
let last = performance.now(), saveT = 0, uiT = 0, achT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(1, (now - last) / 1000); last = now;
  let g = dt * (S.speed || 1); const part = Math.max(0.5, g / 40);
  while (g > 1e-9) { const d = Math.min(part, g); step(d); automate(d); g -= d; }
  uiT += dt; if (uiT > 0.2) { uiT = 0; render(false); }
  achT += dt; if (achT > 1) { achT = 0; checkAch(); }
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }
}
// time away and the dev skip: run the game forward in n steps, then show what came in
function catchUp(sec, title, n = 400) {
  const l0 = S.life, ore0 = S.ore, ch0 = S.charge, g0 = S.gemsLife, v0 = S.voltsLife, e0 = S.elemsLife, s0 = S.starsLife, d0 = S.dmLife, r0 = S.rad, tr0 = S.st.trips;
  for (let i = 0; i < n; i++) { step(sec / n); automate(sec / n); }
  const bits = [`+${fmt(S.life - l0)} coins`]; if (S.ore > ore0) bits.push(`+${fmt(S.ore - ore0)} ore`);
  if (S.gemsLife > g0) bits.push(`+${fmt(S.gemsLife - g0)} 💎`); if (S.voltsLife > v0) bits.push(`+${fmt(S.voltsLife - v0)} ⚡`); if (S.elemsLife > e0) bits.push(`+${fmt(S.elemsLife - e0)} 🧪`);
  if (S.starsLife > s0) bits.push(`+${fmt(S.starsLife - s0)} 🌌`); if (S.dmLife > d0) bits.push(`+${fmt(S.dmLife - d0)} 🌑`); if (S.rad > r0) bits.push(`+${fmt(S.rad - r0)} ☢`);
  if (S.top >= 2 && !robOn('autodis')) bits.push(`capacitor ${Math.floor(ch0 * 100)} → ${Math.floor(S.charge * 100)} %`);
  if (S.st.trips > tr0) bits.push(`${S.st.trips - tr0} ship trips`); if (S.dealQ > 0) bits.push(`${S.dealQ} deal${S.dealQ > 1 ? 's' : ''} waiting`);
  setTimeout(() => toast(title, bits.join(' · ')), 300);
}
(function offline() {
  const away = Math.min(8 * 3600, (Date.now() - (S.last || Date.now())) / 1000);
  if (away < 30) return;
  catchUp(away, `Welcome back: ${Math.round(away / 60)} min`);
})();
if (!S.hints.first) { S.hints.first = 1; setTimeout(() => toast('Tap the glowing node', 'then Buy. Each node you buy reveals its neighbours.', COL.coin), 900); }
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
document.querySelectorAll('a[data-hub]').forEach((a) => { if (location.hostname === 'lennify44.github.io') a.removeAttribute('target'); });
$('btnMute').textContent = S.muted ? '🔇' : '🔊';
if (location.hash === '#bot') window.__game = { get S() { return S; }, depthGain, digDown, DEPTH, depthReq, dmGain, feed, pulseOn, halfLife, vaultShare, gravMult, radMult, VOID, step, automate, buy, layerUp, tileAt, discharge, gemGain, voltGain, WEB, NODE, coinRate, oreRate, visible, reachable, needOk, maxed, costAt, render, checkAch, ACH, react, elemGain, RECIPES, ingredients, pickIngredient, starGain, launch, collect, DEST, shipCount, takeDeal, DEALS, dealEvery, fire, capMax, burstMult, refineCost, recipeOf, bookOf, ARTS, ROBOTS, robOn, rollVeins, veinMult, prospect, fixSave, REQ, dustGain, chargeRate, chargePow, burstLen, burstBase, reactCost, rxCost, roboRate, GAIN, GCAP, GEXP, FORM, starForm, rxPow, dealPow, artChance, artN, robN, side, foundN, refresh, RANK, RANKS, PERKS, rankReq, rankGain, rankUp, rankMult, rankName, ringMax };
render(true);
requestAnimationFrame(frame);
if (S.speed > 1) setSpeed(S.speed);   // the ⏩ pill comes back after a reload
})();
